<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Feuille du bas -->
  <rect x="4" y="10" width="18" height="22" rx="2" fill="#d4c89a" stroke="#b8a870" stroke-width="1"/>
  <!-- Feuille du milieu -->
  <rect x="6" y="7" width="18" height="22" rx="2" fill="#e8ddb0" stroke="#c8b880" stroke-width="1"/>
  <!-- Feuille du haut -->
  <rect x="8" y="4" width="18" height="22" rx="2" fill="#f5f0dc" stroke="#d4c090" stroke-width="1"/>
  <!-- Lignes de texte sur la feuille -->
  <line x1="11" y1="11" x2="23" y2="11" stroke="#c8b060" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="14" x2="23" y2="14" stroke="#c8b060" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="17" x2="19" y2="17" stroke="#c8b060" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crayon -->
  <g transform="rotate(-40, 22, 20)">
    <!-- Corps du crayon -->
    <rect x="20" y="10" width="5" height="14" rx="1" fill="#f0c040"/>
    <!-- Bout métal -->
    <rect x="20" y="22" width="5" height="2.5" fill="#aaaaaa"/>
    <!-- Gomme -->
    <rect x="20" y="24.5" width="5" height="2" rx="0.5" fill="#e87060"/>
    <!-- Pointe -->
    <polygon points="20,24 25,24 22.5,29" fill="#d4a030"/>
    <!-- Mine -->
    <polygon points="21.5,27 23.5,27 22.5,29" fill="#333"/>
    <!-- Reflet -->
    <rect x="21" y="11" width="1.5" height="10" rx="0.5" fill="rgba(255,255,255,0.35)"/>
  </g>
</svg>
