<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Édition galerie</title>
  <link rel="stylesheet" href="../../assets/css/galerie-sculpture.css?v=20260624c">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #7a7a7a; user-select: none; -webkit-user-select: none; }
    .conteneur-salles { width: 100% !important; transform: none !important; }
    .salle {
      width: 100% !important; height: 100vh !important;
      display: flex !important; flex-direction: column !important;
    }
    .salle-sculpture { background-color: #7a7a7a; }
    .mur-inferieur { flex: 0 0 35px !important; height: 35px !important; background: #222 !important; }
    .plancher-sol {
      flex: 1 !important; min-height: 0 !important; max-height: none !important;
      position: relative !important;
    }
    .silhouettes-sol, .panneau-nav, .plaque-nav, .porte-mur, .salle-titre, .nom-salle { display: none !important; }
    .socle-wrapper { position: absolute; }
  </style>
</head>
<body data-page="galerie">
  <div class="conteneur-salles" id="conteneurSalles"></div>
  <script>
    window.GALERIE_OEUVRES_PATHS = ["data/oeuvres/peinture.json","data/oeuvres/sculpture.json"];
    window.GALERIE_SALLES_PATH = "data/salles.json";
    window.GALERIE_ASSETS_BASE = "../../";
    window._GALERIE_EDIT = true;
    /* Forcer le mode d'affichage selon la vue demandée par l'admin (pc/gsm) */
    var _vueParam = new URLSearchParams(location.search).get('vue');
    if (_vueParam === 'gsm') window._GALERIE_FORCE_MOBILE = true;
    else if (_vueParam === 'pc') window._GALERIE_FORCE_MOBILE = false;
  </script>
  <script src="../../assets/js/galerie-core.js?v=20260708i"></script>
  <script src="../../assets/js/galerie-sculpture.js?v=20260708m"></script>
  <script>
    /* Attendre les données injectées par l'admin parent.
       Si rien ne vient (ouverture directe hors admin), fetch après court délai. */
    var _initDone = false;
    function _doInit() { if (_initDone) return; _initDone = true; initGalerie(); }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'init-data' && !_initDone) {
        window._GALERIE_INJECTED = { toiles: e.data.toiles, salles: e.data.salles };
        _doInit();
      }
    });
    /* Signaler au parent qu'on est prêt à recevoir les données */
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'iframe-awaiting-data' }, '*');
      /* Fallback : si l'admin ne répond pas en 800ms, fetch normalement */
      setTimeout(_doInit, 800);
    } else {
      _doInit();
    }
  </script>
</body>
</html>
