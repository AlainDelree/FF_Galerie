<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Frédérique Ferette — Infos & Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&family=Cinzel:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .entete { display:flex; flex-direction:row; justify-content:space-between; align-items:center; transform:translateY(0); transition:transform .4s ease; }
    .entete.cache { transform:translateY(-100%); }
    .pied { display:flex; flex-direction:column; align-items:center; gap:.1rem; }
    .signature-artiste { font-family:'Playfair Display',serif; font-size:3.5rem; background:linear-gradient(135deg,#c8a050 0%,#f0d080 50%,#c8a050 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; opacity:.85; line-height:1; margin-bottom:.2rem; letter-spacing:.05em; }

    /* ── Page infos ── */
    .infos-wrap {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
      margin-top: 2.2rem;
      text-align: left;
    }

    /* Section titre */
    .section-titre {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: .65rem;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: rgba(200,160,80,.5);
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-titre::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(200,160,80,.25), transparent);
    }

    /* Événement */
    .evenement {
      display: flex;
      gap: 1.4rem;
      align-items: flex-start;
      padding-bottom: 1.6rem;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .evenement:last-child { border-bottom: none; padding-bottom: 0; }
    .evt-date {
      flex-shrink: 0;
      width: 5rem;
      font-family: 'Cinzel', serif;
      font-size: .6rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #c8a050;
      padding-top: .25rem;
      text-align: right;
      line-height: 1.6;
    }
    .evt-corps { flex: 1; }
    .evt-titre {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-clair, #e0d8cc);
      margin: 0 0 .3rem;
      line-height: 1.35;
    }
    .evt-lieu {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: .78rem;
      letter-spacing: .1em;
      color: rgba(200,160,80,.55);
      margin-bottom: .55rem;
    }
    .evt-desc {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: .85rem;
      line-height: 1.7;
      color: var(--text-doux, #888880);
      margin: 0 0 .6rem;
      white-space: pre-line;
    }
    .evt-lien {
      font-family: 'Cinzel', serif;
      font-size: .55rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #c8a050;
      text-decoration: none;
      opacity: .7;
      transition: opacity .2s;
    }
    .evt-lien:hover { opacity: 1; }
    .evt-lien::after { content: ' ↗'; }

    /* Collègues */
    .collegues-liste {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .collegue {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .85rem 1.1rem;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 2px;
      background: rgba(255,255,255,.02);
      text-decoration: none;
      transition: background .2s, border-color .2s;
    }
    .collegue:hover { background: rgba(200,160,80,.05); border-color: rgba(200,160,80,.18); }
    .collegue-info { flex: 1; }
    .collegue-nom {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      color: var(--text-clair, #e0d8cc);
      margin: 0 0 .2rem;
    }
    .collegue-desc {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: .75rem;
      color: var(--text-doux, #888880);
      letter-spacing: .06em;
    }
    .collegue-type {
      font-family: 'Cinzel', serif;
      font-size: .5rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(200,160,80,.4);
      flex-shrink: 0;
    }

    /* Message vide */
    .vide {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .85rem;
      color: rgba(255,255,255,.18);
      text-align: center;
      padding: 1rem 0;
    }

    /* Responsive */
    @media (max-width: 540px) {
      .infos-wrap { gap: 2.8rem; }
      .evenement { flex-direction: column; gap: .4rem; }
      .evt-date { width: auto; text-align: left; padding-top: 0; }
      .collegue { padding: .75rem .9rem; }
    }
  </style>
</head>
<body class="theme-sombre">

  <div class="scene-entree">

    <header class="entete">
      <nav class="nav-pages">
        <a href="index.html" class="lien-contact">Accueil</a>
        <span class="nav-sep">|</span>
        <a href="infos.html" class="lien-contact actif">Infos</a>
        <span class="nav-sep">|</span>
        <a href="contact.html" class="lien-contact">Contact</a>
      </nav>
      </header>

    <main class="contenu-principal">
      <div class="encadre-titre">

        <h1 class="contact-titre" style="font-family:'Cinzel',serif;font-weight:400;font-size:1.6rem;letter-spacing:.38em;text-transform:uppercase;background:linear-gradient(135deg,#c8a050 0%,#f0d080 40%,#c8a050 60%,#e8c060 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0 0 1.2rem;">
          Infos &amp; Agenda
        </h1>
        <div class="separateur"></div>

        <div class="infos-wrap" id="infosWrap">
          <p class="vide">Chargement…</p>
        </div>

      </div>
    </main>

    <footer class="pied">
      <div class="signature-artiste" aria-label="Signature">FF</div>
      <span class="mention">&copy; Frédérique Ferette</span>
      <span class="mention" style="font-size:.62rem;opacity:.38;margin-top:.15rem;">Musique&nbsp;: <em>Pictures at an Exhibition</em> — Mussorgsky &middot; <a href="https://musopen.org/music/performer/alexander-ghindin/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">Alexander Ghindin</a> &middot; CC&nbsp;BY</span>
    </footer>

  </div>

  <script src="assets/js/main.js"></script>
  <script>
    /* ── Rendu des infos depuis infos.json ── */
    fetch('data/infos.json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var wrap = document.getElementById('infosWrap');
        wrap.innerHTML = '';

        /* ── Agenda ── */
        var secEvt = document.createElement('section');
        secEvt.setAttribute('aria-label', 'Agenda et expositions');

        var titEvt = document.createElement('h2');
        titEvt.className = 'section-titre';
        titEvt.textContent = 'Agenda';
        secEvt.appendChild(titEvt);

        var evts = data.evenements || [];
        if (evts.length === 0) {
          var vide = document.createElement('p');
          vide.className = 'vide';
          vide.textContent = 'Aucun événement en cours.';
          secEvt.appendChild(vide);
        } else {
          evts.forEach(function(e){
            var art = document.createElement('article');
            art.className = 'evenement';

            var dateEl = document.createElement('div');
            dateEl.className = 'evt-date';
            dateEl.textContent = e.dateAffichage || '';
            art.appendChild(dateEl);

            var corps = document.createElement('div');
            corps.className = 'evt-corps';

            var titre = document.createElement('h3');
            titre.className = 'evt-titre';
            titre.textContent = e.titre || '';
            corps.appendChild(titre);

            if (e.lieu) {
              var lieu = document.createElement('p');
              lieu.className = 'evt-lieu';
              lieu.textContent = e.lieu;
              corps.appendChild(lieu);
            }
            if (e.description) {
              var desc = document.createElement('p');
              desc.className = 'evt-desc';
              desc.textContent = e.description;
              corps.appendChild(desc);
            }
            if (e.lien) {
              var lien = document.createElement('a');
              lien.className = 'evt-lien';
              lien.href = e.lien;
              lien.target = '_blank';
              lien.rel = 'noopener';
              lien.textContent = 'En savoir plus';
              corps.appendChild(lien);
            }

            art.appendChild(corps);
            secEvt.appendChild(art);
          });
        }
        wrap.appendChild(secEvt);

        /* ── Collègues & liens ── */
        var secCol = document.createElement('section');
        secCol.setAttribute('aria-label', 'Collègues et liens artistiques');

        var titCol = document.createElement('h2');
        titCol.className = 'section-titre';
        titCol.textContent = 'Liens artistiques';
        secCol.appendChild(titCol);

        var cols = data.collegues || [];
        if (cols.length === 0) {
          var vide2 = document.createElement('p');
          vide2.className = 'vide';
          vide2.textContent = 'Aucun lien pour l\'instant.';
          secCol.appendChild(vide2);
        } else {
          var liste = document.createElement('div');
          liste.className = 'collegues-liste';
          cols.forEach(function(c){
            var a = document.createElement('a');
            a.className = 'collegue';
            a.href = c.lien || '#';
            a.target = '_blank';
            a.rel = 'noopener';

            var info = document.createElement('div');
            info.className = 'collegue-info';

            var nom = document.createElement('p');
            nom.className = 'collegue-nom';
            nom.textContent = c.nom || '';
            info.appendChild(nom);

            if (c.description) {
              var desc = document.createElement('p');
              desc.className = 'collegue-desc';
              desc.textContent = c.description;
              info.appendChild(desc);
            }
            a.appendChild(info);

            if (c.type) {
              var type = document.createElement('span');
              type.className = 'collegue-type';
              type.textContent = c.type;
              a.appendChild(type);
            }

            liste.appendChild(a);
          });
          secCol.appendChild(liste);
        }
        wrap.appendChild(secCol);
      })
      .catch(function(){
        document.getElementById('infosWrap').innerHTML =
          '<p class="vide">Impossible de charger les informations.</p>';
      });

    /* Header auto-hide */
    (function(){
      var h = document.querySelector('.entete');
      var t;
      function show(){ h.classList.remove('cache'); clearTimeout(t); t = setTimeout(function(){ h.classList.add('cache'); }, 2500); }
      document.addEventListener('mousemove', function(e){ if(e.clientY < 80) show(); });
      document.addEventListener('touchstart', show, { passive:true });
      t = setTimeout(function(){ h.classList.add('cache'); }, 2500);
    })();
  </script>

</body>
</html>
