  <style>
    .apropos-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }
    .apropos-photo {
      float: right;
      margin: 0 0 1.5rem 2rem;
      width: clamp(120px, 30%, 200px);
      border-radius: 2px;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .apropos-titre-principal {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      background: linear-gradient(135deg,#c8a050 0%,#f0d080 40%,#c8a050 60%,#e8c060 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 .3rem;
    }
    .apropos-sous-titre {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: .9rem;
      letter-spacing: .2em;
      color: var(--text-doux, #aaa);
      text-transform: uppercase;
      margin: 0 0 1.8rem;
    }
    .apropos-texte {
      font-family: 'Lato', sans-serif;
      font-size: clamp(.88rem, 2.5vw, 1rem);
      line-height: 1.8;
      color: var(--text, #e0d8cc);
    }
    .apropos-texte p { margin: 0 0 1.1em; }
    .apropos-texte p:last-child { margin-bottom: 0; }
    .apropos-placeholder {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--text-doux, #aaa);
      font-size: .95rem;
    }
    @media (max-width: 500px) {
      .apropos-photo { float: none; display: block; width: 60%; margin: 0 auto 1.5rem; }
    }
  </style>
</head>
<body class="theme-sombre" data-page="apropos">

  <div class="scene-entree">

    <header class="entete">
      <nav class="nav-pages">
        <a href="index.html" class="lien-contact">Accueil</a>
        <span class="nav-sep">|</span>
        <a href="apropos.html" class="lien-contact actif">À propos</a>
        <span class="nav-sep">|</span>
        <a href="infos.html" class="lien-contact">Infos</a>
        <span class="nav-sep">|</span>
        <a href="contact.html" class="lien-contact">Contact</a>
        <span class="nav-sep" id="sep-artistes" style="display:none">|</span>
        <div class="nav-dropdown" id="nav-artistes" style="display:none">
          <button class="nav-dropdown-btn" id="nav-artistes-btn">Artistes ▾</button>
          <div class="nav-dropdown-menu" id="nav-artistes-menu"></div>
        </div>
      </nav>
      <div class="controles">
        <button class="btn-musique off" id="btnMusique" aria-label="Musique on/off">
          <span id="iconeMusique">&#9835;</span>
        </button>
      </div>
    </header>

    <main class="page-contenu">
      <div class="apropos-wrap">

        <img id="apropos-photo" class="apropos-photo" alt="Frédérique Ferette" style="display:none;">

        <h1 class="apropos-titre-principal">Frédérique Ferette</h1>
        <p class="apropos-sous-titre" id="apropos-sous-titre">Peintre</p>

        <div class="separateur" style="margin-bottom:1.8rem;"></div>

        <div class="apropos-texte" id="apropos-texte">
          <p class="apropos-placeholder">Présentation à venir…</p>
        </div>

      </div>
    </main>

    <footer class="pied">
      <div class="signature-artiste" aria-label="Signature">FF</div>
      <span class="mention">&copy; Frédérique Ferette</span>
      <span class="mention mention-musique" style="font-size:.62rem;opacity:.38;margin-top:.15rem;"></span>
    </footer>

  </div>

  <script src="assets/js/main.js"></script>
  <script>
    fetch('data/infos.json?v=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var p = d.presentation || {};
        // Sous-titre
        if (p.titre) {
          document.getElementById('apropos-sous-titre').textContent = p.titre;
        }
        // Photo portrait
        if (p.photo) {
          var img = document.getElementById('apropos-photo');
          img.src = p.photo;
          img.style.display = '';
        }
        // Texte biographique
        if (p.texte && p.texte.trim()) {
          var el = document.getElementById('apropos-texte');
          el.innerHTML = p.texte.trim()
            .split(/\n\n+/)
            .map(function(par) {
              return '<p>' + par.replace(/\n/g, '<br>') + '</p>';
            })
            .join('');
        }
      })
      .catch(function() {});
  </script>
  <script src="assets/js/nav-artistes.js"></script>

<script data-goatcounter="https://frederiqueferette.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
