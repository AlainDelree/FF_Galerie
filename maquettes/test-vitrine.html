<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Test vitrine (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:#0c0906;color:#e8dcc8;font-family:'Lato',system-ui,sans-serif;}
  body{max-width:460px;margin:0 auto;min-height:100dvh;}
  header{padding:12px 16px 6px;}
  h1{font-family:'Cinzel',serif;font-size:16px;color:#f0d080;margin:0 0 2px;}
  .sub{font-size:11.5px;color:#9a8b76;line-height:1.35;}
  .ctrls{display:flex;gap:8px;align-items:center;padding:8px 16px 4px;flex-wrap:wrap;}
  .ctrls b{font-size:11px;color:#c8a050;text-transform:uppercase;letter-spacing:.05em;}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #3a2e20;cursor:pointer;}
  .sw.on{border-color:#f0d080;box-shadow:0 0 0 2px rgba(240,208,128,.35);}
  .stage-wrap{padding:0 12px;}
  /* sol en perspective, comme la vraie salle sculpture */
  .plancher-sol{position:relative;width:100%;height:60dvh;min-height:360px;overflow:hidden;
    border-radius:10px;border:1px solid #2c2116;
    background:linear-gradient(180deg,#150e08 0%,#241a12 42%);}
  .sol{position:absolute;left:0;right:0;bottom:0;height:62%;
    background:repeating-linear-gradient(to right,transparent 0,transparent 13%,rgba(0,0,0,.10) 13%,rgba(0,0,0,.10) 13.4%),
      linear-gradient(180deg,#3a2a16 0%,#8a6228 78%);
    clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:inset 0 20px 40px rgba(0,0,0,.55);}
  .sol::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,transparent 0,transparent 9%,rgba(0,0,0,.16) 9%,rgba(0,0,0,.16) 9.5%);opacity:.55;}
  footer{padding:10px 16px 20px;font-size:10.5px;color:#6b5f4e;line-height:1.4;}
  .err{color:#e0564b;padding:12px 16px;font-size:12px;white-space:pre-wrap;}
</style>
</head>
<body class="theme-sombre" data-page="galerie">
<header>
  <h1>Test vitrine — rendu procédural réel</h1>
  <div class="sub">Appelle le vrai <code>creerVitrine()</code> de galerie-sculpture.js avec des données injectées. Aucune donnée live touchée.</div>
</header>
<div class="ctrls">
  <b>Couleur</b>
  <span class="sw on" style="background:#6a4b28" data-c="#6a4b28"></span>
  <span class="sw" style="background:#3f342a" data-c="#3f342a"></span>
  <span class="sw" style="background:#8c8278" data-c="#8c8278"></span>
  <span class="sw" style="background:#2a3340" data-c="#2a3340"></span>
</div>
<div class="stage-wrap">
  <div class="plancher-sol" id="floor"><div class="sol"></div></div>
</div>
<div id="err"></div>
<footer>maquettes/test-vitrine.html — sur <b>dev</b> uniquement. noindex. Bump ?v= si galerie-sculpture.js change.</footer>

<!-- vrai code : core (consts GALERIE_CFG/RENDERERS, pas d'auto-init) + sculpture -->
<script src="../assets/js/galerie-core.js?v=20260706e"></script>
<script src="../assets/js/galerie-sculpture.js?v=20260706f"></script>
<script>
  try {
    GALERIE_CFG.assetsBase = '../artistes/dinso/';   /* les photos test = pièces Dinso réelles */

    /* Table des œuvres (par id) : la vitrine + son contenu (photos réelles) */
    var PIECES = {
      99: { id:99, est_vitrine:true, titre:'Vitrine test', planches:3, places:4, couleur:'#6a4b28',
            /* index "planche·place" (bas→haut, gauche→droite) → id d'œuvre */
            contenu:{ '11':11,'12':13,'13':11,'14':13, '21':13,'22':11,'23':13, '31':11,'32':13 } },
      11: { id:11, titre:'Chaise Bureau', photo:'assets/images/toiles/piece-011.png' },
      13: { id:13, titre:'Papillon',      photo:'assets/images/toiles/piece-013.png' }
    };
    var POS = { id:99, x:50, y:30, gabarit:'XL' };

    function rendre(couleur) {
      var floor = document.getElementById('floor');
      var old = floor.querySelector('.vitrine-wrapper'); if (old) old.remove();
      PIECES[99].couleur = couleur;
      var el = creerVitrine(PIECES[99], POS, PIECES, {});
      floor.appendChild(el);
    }
    rendre('#6a4b28');

    document.querySelectorAll('.sw').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.sw').forEach(function (x){ x.classList.remove('on'); });
        b.classList.add('on');
        rendre(b.dataset.c);
      });
    });
  } catch (e) {
    document.getElementById('err').className = 'err';
    document.getElementById('err').textContent = 'Erreur : ' + (e && e.message ? e.message : e) + '\n' + (e && e.stack ? e.stack : '');
  }
</script>
</body>
</html>
