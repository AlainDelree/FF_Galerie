<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Maquette — étagères &amp; anti-chevauchement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall1:#241a12; --wall2:#150e08; --floor:#8a6228; --floor-back:#3a2a16;
    --gold:#c8a050; --gold-lt:#f0d080; --cream:#e8dcc8; --dim:#9a8b76;
    --stone:#6d645a; --stone-lt:#8c8278; --stone-dk:#4a433b;
    --ok:#5ec46a; --no:#e0564b; --obs-a:#1a1510; --obs-b:#2a2018;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:#0c0906; color:var(--cream);
    font-family:'Lato',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{max-width:460px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}

  header{padding:14px 16px 8px;}
  h1{font-family:'Cinzel',serif; font-weight:600; font-size:17px; letter-spacing:.02em;
     margin:0 0 2px; color:var(--gold-lt);}
  .sub{font-size:12px; color:var(--dim); line-height:1.35;}

  .tabs{display:flex; gap:6px; padding:10px 12px 8px; overflow-x:auto;}
  .tab{flex:0 0 auto; padding:8px 12px; border:1px solid #3a2e20; border-radius:999px;
    background:#1a130c; color:var(--cream); font-size:12.5px; font-weight:700; cursor:pointer;
    white-space:nowrap; transition:.15s;}
  .tab.on{background:linear-gradient(180deg,var(--gold),#a9863f); color:#211705; border-color:var(--gold-lt);}

  .stage-wrap{padding:0 12px;}
  .stage{position:relative; width:100%; height:58dvh; min-height:340px; overflow:hidden;
    border-radius:10px; border:1px solid #2c2116;
    background:linear-gradient(180deg,var(--wall2) 0%,var(--wall1) 42%);}
  .sol{position:absolute; left:0; right:0; bottom:0; height:62%;
    background:
      repeating-linear-gradient(to right,transparent 0,transparent 13%,rgba(0,0,0,.10) 13%,rgba(0,0,0,.10) 13.4%),
      linear-gradient(180deg,var(--floor-back) 0%,var(--floor) 78%);
    clip-path:polygon(50% 0,100% 100%,0 100%);
    box-shadow:inset 0 20px 40px rgba(0,0,0,.55);}
  .sol::after{content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(180deg,transparent 0,transparent 9%,rgba(0,0,0,.16) 9%,rgba(0,0,0,.16) 9.5%);
    opacity:.55;}
  .plinth{position:absolute; left:0; right:0; bottom:62%; height:1px; background:rgba(0,0,0,.5);}
  .glow{position:absolute; top:-10%; left:50%; width:70%; height:55%; transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(240,208,128,.16),transparent 70%); pointer-events:none;}

  .obj{position:absolute; transform-origin:bottom center; transform:translateX(-50%);
    cursor:grab; touch-action:none; will-change:left,bottom,transform;}
  .obj.drag{cursor:grabbing; z-index:999 !important;}
  .socle{width:46px; height:34px; margin:0 auto; border-radius:3px 3px 2px 2px;
    background:linear-gradient(180deg,var(--stone-lt),var(--stone) 55%,var(--stone-dk));
    box-shadow:0 6px 12px rgba(0,0,0,.5); position:relative;}
  .socle::before{content:""; position:absolute; left:-4px; right:-4px; bottom:-5px; height:8px;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 72%);}
  .art{display:block; margin:0 auto -2px; filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));}
  .halo{position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border-radius:50%; pointer-events:none; opacity:0; transition:opacity .12s;
    border:2px solid var(--ok); background:rgba(94,196,106,.14);}
  .obj.showfoot .halo{opacity:.9;}
  .obj.bad .halo{border-color:var(--no); background:rgba(224,86,75,.18);}

  .shelf{position:absolute; transform-origin:bottom center; transform:translateX(-50%);
    cursor:pointer; touch-action:none;}
  .shelf-halo{position:absolute; left:50%; top:50%; width:150%; height:130%;
    transform:translate(-50%,-50%); border-radius:14px; pointer-events:none; z-index:-1;
    background:radial-gradient(ellipse at center,rgba(240,208,128,.42),rgba(240,208,128,.10) 55%,transparent 72%);
    animation:haloPulse 4s ease-in-out infinite;}
  @keyframes haloPulse{0%,100%{opacity:.35; transform:translate(-50%,-50%) scale(.92);}
                        50%{opacity:.9;  transform:translate(-50%,-50%) scale(1.06);}}
  .shelf-body{position:relative; width:96px; background:linear-gradient(180deg,#6a4b28,#4a3419);
    border:1px solid #2c1e0d; border-radius:3px; box-shadow:0 8px 18px rgba(0,0,0,.55);}
  .level{position:relative; height:38px; border-bottom:5px solid #3a2913;
    display:flex; align-items:flex-end; justify-content:space-around; padding:0 5px 2px;}
  .level:last-child{border-bottom:none;}
  .plaque{position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    font-family:'Cinzel',serif; font-size:8.5px; letter-spacing:.03em; color:#2a1d0a;
    background:linear-gradient(180deg,var(--gold-lt),#b58f3e); padding:2px 7px; border-radius:3px;
    white-space:nowrap; box-shadow:0 2px 4px rgba(0,0,0,.5);}

  .overlay{position:absolute; inset:0; display:none; flex-direction:column; z-index:50;
    border-radius:10px; overflow:hidden;}
  .overlay.open{display:flex;}
  .vitrine{background:linear-gradient(180deg,#0e0a06,#1c140c);}
  .vhead{padding:11px 13px; border-bottom:1px solid #33271a; display:flex;
    align-items:center; gap:9px; flex-wrap:wrap;}
  .vback{font-size:12.5px; color:var(--gold-lt); background:#241a10; border:1px solid #3a2c1a;
    border-radius:8px; padding:6px 10px; cursor:pointer;}
  .vtitle{font-family:'Cinzel',serif; font-size:13.5px; color:var(--gold-lt); flex:1;}
  .immbtn{font-size:11px; font-weight:700; border-radius:999px; padding:5px 10px; cursor:pointer;
    border:1px solid #3a2c1a; background:#1a130c; color:var(--dim);}
  .immbtn.on{background:#243a24; color:#bfe9c4; border-color:#3d6a41;}

  .vgrid{flex:1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:14px;
    align-content:center; background:radial-gradient(ellipse at 50% 25%,rgba(240,208,128,.10),transparent 60%);}
  .cell{background:linear-gradient(180deg,#2c1f10,#1b1209); border:1px solid #241809;
    border-radius:6px; padding:12px 4px 8px; text-align:center; cursor:pointer;
    box-shadow:inset 0 6px 16px rgba(0,0,0,.5); position:relative;}
  .cell .spot{position:absolute; top:2px; left:50%; width:70%; height:40%; transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(255,240,200,.14),transparent 70%); pointer-events:none;}
  .disc{perspective:300px; height:52px; display:flex; align-items:flex-end; justify-content:center;}
  .disc .art{margin-bottom:0;}
  .vgrid.imm .disc .art{animation:turntable 5.5s ease-in-out infinite; transform-style:preserve-3d;}
  @keyframes turntable{0%,100%{transform:rotateY(-26deg);}50%{transform:rotateY(26deg);}}
  .badge{position:absolute; top:5px; right:5px; font-size:8px; font-weight:700; border-radius:4px; padding:1px 4px;}
  .badge.b3d{background:#243a24; color:#bfe9c4;}
  .badge.bph{background:#2a2016; color:var(--dim);}
  .cell .nm{margin-top:7px; font-size:10px; color:var(--cream);}
  .cell .mt{font-size:8.5px; color:var(--dim);}

  /* ── niveau 3 : ta SALLE D'OBSERVATION (descriptive), reproduite ── */
  .obs{z-index:60; background:var(--obs-a);}
  .obs-bands{position:absolute; inset:0; display:flex; z-index:1;}
  .obs-bands i{flex:1; height:100%;}
  .obs-view{position:absolute; inset:0; z-index:10; display:flex; align-items:center;
    justify-content:center; perspective:520px;}
  .obs-view .art{animation:turntable 6s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));}
  .obs-title{position:absolute; top:0; left:0; width:100%; text-align:center; z-index:20; margin:0;
    padding:12px 0; font-family:'Cinzel',serif; font-size:16px; color:var(--cream);
    background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.25),transparent);}
  .obs-hint{position:absolute; bottom:5.2rem; left:0; width:100%; text-align:center; z-index:20;
    font-size:.72rem; letter-spacing:.08em; color:rgba(255,255,255,.85); pointer-events:none;
    transition:color 1.2s ease,font-size 1.2s ease;}
  .obs-hint.fade{color:rgba(255,255,255,.25); font-size:.6rem;}
  .obs-meta{position:absolute; bottom:0; left:0; width:100%; text-align:center; z-index:20;
    padding:22px 0 1.4rem; font-size:.74rem; letter-spacing:.08em; color:rgba(255,255,255,.55);
    background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,.2),transparent);}
  .obs-close{position:absolute; top:8px; right:10px; z-index:30; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.35); color:#fff; font-size:15px; cursor:pointer;}
  /* porte de retour (provenance) — ici vers la vitrine */
  .obs-porte{position:absolute; left:0; top:50%; transform:translateY(-50%); z-index:25;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    padding:14px 10px 14px 6px; color:var(--gold-lt);}
  .obs-porte .arche{width:30px; height:46px; border:2px solid var(--gold); border-bottom:none;
    border-radius:16px 16px 0 0; background:linear-gradient(180deg,rgba(200,160,80,.25),transparent);}
  .obs-porte .fleche{font-size:16px; margin-top:-30px;}
  .obs-porte .plabel{font-family:'Cinzel',serif; font-size:10px;}

  .cap{padding:10px 16px 4px;}
  .cap .q{font-size:11px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px;}
  .cap .t{font-size:12.5px; color:var(--cream); line-height:1.45;}
  .hint{font-size:11px; color:var(--dim); margin-top:5px; font-style:italic;}

  .toggle{display:flex; gap:6px; margin:8px 0 2px;}
  .toggle button{flex:1; padding:7px; font-size:12px; font-weight:700; border-radius:8px;
    border:1px solid #3a2e20; background:#1a130c; color:var(--cream); cursor:pointer;}
  .toggle button.on{background:#2c2114; color:var(--gold-lt); border-color:var(--gold);}
  footer{padding:10px 16px 20px; font-size:10.5px; color:#6b5f4e; line-height:1.4;}

  @media (prefers-reduced-motion: reduce){
    .shelf-halo,.vgrid.imm .disc .art,.obs-view .art{animation:none;}
  }
</style>
</head>
<body>
<header>
  <h1>Étagères &amp; anti-chevauchement</h1>
  <div class="sub">Maquette jetable — formes bidon, seul le principe compte.</div>
</header>

<div class="tabs" id="tabs">
  <button class="tab" data-m="A">A · Étagère au sol</button>
  <button class="tab on" data-m="B">B · Parcours vitrine</button>
  <button class="tab" data-m="C">C · Mixte / dédiée</button>
  <button class="tab" data-m="D">D · Anti-chevauchement</button>
</div>

<div class="stage-wrap">
  <div class="toggle" id="toggleC" style="display:none">
    <button data-c="mix" class="on">Salle mixte</button>
    <button data-c="ded">Salle vitrines</button>
  </div>
  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="sol"></div>
    <div class="plinth"></div>
    <div id="layer"></div>

    <!-- niveau 2 : vitrine (équivalent salle immersive de l'étagère) -->
    <div class="overlay vitrine" id="vitrine">
      <div class="vhead">
        <button class="vback" data-close="vitrine">‹ Salle</button>
        <span class="vtitle">Vitrine · petits formats</span>
        <button class="immbtn on" id="immBtn">immersif ●</button>
      </div>
      <div class="vgrid imm" id="vgrid"></div>
    </div>

    <!-- niveau 3 : ta salle d'observation (descriptive) -->
    <div class="overlay obs" id="obs">
      <div class="obs-bands" id="obsBands"></div>
      <div class="obs-view" id="obsView"></div>
      <h2 class="obs-title" id="obsTitle"></h2>
      <div class="obs-hint" id="obsHint">Touchez l’objet et glissez pour le tourner</div>
      <div class="obs-meta" id="obsMeta"></div>
      <div class="obs-porte" data-close="obs">
        <div class="arche"></div><span class="fleche">←</span><span class="plabel">Vitrine</span>
      </div>
      <button class="obs-close" data-close="obs">✕</button>
    </div>
  </div>
</div>

<div class="cap" id="cap"></div>
<footer>maquettes/etagere.html — sur <b>dev</b> uniquement, jamais fusionné vers main. noindex.</footer>

<script>
const ART = {
  chaise: (s=1)=>`<svg class="art" width="${34*s}" height="${44*s}" viewBox="0 0 34 44"><g fill="none" stroke="#d9c9a8" stroke-width="2.4" stroke-linecap="round"><path d="M10 6 v14 M10 20 h14 v-14"/><path d="M10 20 v10 M24 20 v10"/><path d="M17 30 v8"/><ellipse cx="17" cy="41" rx="9" ry="2.4" fill="#a9863f" stroke="none"/><path d="M11 38 l-4 4 M23 38 l4 4"/></g></svg>`,
  papillon:(s=1)=>`<svg class="art" width="${40*s}" height="${34*s}" viewBox="0 0 40 34"><g fill="#c8a050" stroke="#f0d080" stroke-width="1"><path d="M20 17 C6 -2 -4 6 8 16 C-3 20 8 34 20 18 Z"/><path d="M20 17 C34 -2 44 6 32 16 C43 20 32 34 20 18 Z"/><line x1="20" y1="6" x2="20" y2="30" stroke="#5a4420" stroke-width="2"/></g></svg>`,
  buste:(s=1)=>`<svg class="art" width="${30*s}" height="${40*s}" viewBox="0 0 30 40"><g fill="#cdbfa6"><circle cx="15" cy="11" r="8"/><path d="M4 40 C4 24 26 24 26 40 Z"/></g></svg>`,
  vase:(s=1)=>`<svg class="art" width="${26*s}" height="${38*s}" viewBox="0 0 26 38"><path d="M8 2 h10 l-1 7 C24 14 24 30 13 36 C2 30 2 14 9 9 Z" fill="#b9895a" stroke="#e0c08a" stroke-width="1"/></svg>`,
  cube:(s=1)=>`<svg class="art" width="${30*s}" height="${32*s}" viewBox="0 0 30 32"><g stroke="#e0c08a" stroke-width="1"><path d="M6 10 l9-6 9 6 -9 6Z" fill="#c8a878"/><path d="M6 10 v12 l9 6 V16Z" fill="#9c7a4e"/><path d="M24 10 v12 l-9 6 V16Z" fill="#b18a58"/></g></svg>`,
  galet:(s=1)=>`<svg class="art" width="${34*s}" height="${22*s}" viewBox="0 0 34 22"><path d="M2 16 C0 6 12 0 20 3 C33 7 36 20 22 21 C12 22 4 22 2 16Z" fill="#8f9aa2" stroke="#c3ccd2" stroke-width="1"/></svg>`
};

const stage=document.getElementById('stage'), layer=document.getElementById('layer'), cap=document.getElementById('cap');
const vitrine=document.getElementById('vitrine'), obs=document.getElementById('obs');
const vgrid=document.getElementById('vgrid'), toggleC=document.getElementById('toggleC');

const VITRINE_ITEMS = [
  {art:'chaise', nm:'Chaise Bureau', mt:'métal soudé',  dim:'42 × 40 × 88 cm'},
  {art:'vase',   nm:'Écume',         mt:'grès émaillé',  dim:'14 × 14 × 24 cm'},
  {art:'cube',   nm:'Bloc I',        mt:'chêne massif',  dim:'18 × 18 × 20 cm'},
  {art:'galet',  nm:'Galet',         mt:'marbre poli',   dim:'22 × 12 × 9 cm'},
  {art:'buste',  nm:'Étude',         mt:'plâtre patiné', dim:'16 × 14 × 30 cm'},
  {art:'vase',   nm:'Col long',      mt:'terre cuite',   dim:'12 × 12 × 34 cm'}
];
let immersif = true;

const persp=y=>(1-(y/100)*0.42);
function placeObj(o){o.el.style.left=o.x+'%'; o.el.style.bottom=o.y+'%';
  o.el.style.transform='translateX(-50%) scale('+persp(o.y).toFixed(3)+')'; o.el.style.zIndex=Math.round((100-o.y)*10);}
function makeObj({x,y,art,scale=1,foot=[24,10],drag=false}){
  const el=document.createElement('div'); el.className='obj';
  el.innerHTML=ART[art](scale)+`<div class="socle"></div><div class="halo"></div>`;
  layer.appendChild(el);
  const o={el,x,y,art,foot}; placeObj(o);
  const halo=el.querySelector('.halo'), stw=stage.clientWidth, sth=stage.clientHeight;
  halo.style.width=((foot[0]/100)*stw*2)+'px'; halo.style.height=((foot[1]/100)*sth*0.5*2)+'px';
  if(drag) enableDrag(o);
  return o;
}
function makeShelf({x,y,items,plaque,onTap}){
  const el=document.createElement('div'); el.className='shelf';
  el.style.left=x+'%'; el.style.bottom=y+'%';
  el.style.transform='translateX(-50%) scale('+persp(y).toFixed(3)+')'; el.style.zIndex=Math.round((100-y)*10);
  const lvls=items.map(r=>`<div class="level">${r.map(a=>ART[a](0.5)).join('')}</div>`).join('');
  el.innerHTML=`<div class="shelf-halo"></div><div class="shelf-body">${lvls}`+(plaque?`<div class="plaque">${plaque}</div>`:'')+`</div>`;
  layer.appendChild(el);
  if(onTap) el.addEventListener('click',onTap);
  return el;
}

/* niveau 2 : vitrine */
function renderVgrid(){
  vgrid.classList.toggle('imm',immersif);
  vgrid.innerHTML=VITRINE_ITEMS.map((it,i)=>
    `<div class="cell" data-i="${i}"><span class="spot"></span>
       <span class="badge ${immersif?'b3d':'bph'}">${immersif?'3D':'photo'}</span>
       <div class="disc">${ART[it.art](0.9)}</div>
       <div class="nm">${it.nm}</div><div class="mt">${it.mt}</div></div>`).join('');
}
function openVitrine(){ renderVgrid(); vitrine.classList.add('open'); }
document.getElementById('immBtn').addEventListener('click',function(){
  immersif=!immersif; this.classList.toggle('on',immersif);
  this.textContent = immersif?'immersif ●':'photo ○'; renderVgrid();
});
vgrid.addEventListener('click',e=>{const c=e.target.closest('.cell'); if(c) openObservation(+c.dataset.i);});

/* niveau 3 : salle d'observation (descriptive) — reproduit ouvrirSalleObservation */
function openObservation(i){
  const it=VITRINE_ITEMS[i];
  document.getElementById('obsBands').innerHTML =
    Array.from({length:12},(_,k)=>`<i style="background:${k%2?'var(--obs-b)':'var(--obs-a)'}"></i>`).join('');
  document.getElementById('obsView').innerHTML = ART[it.art](3.4);
  document.getElementById('obsTitle').textContent = it.nm;
  document.getElementById('obsMeta').textContent = it.mt + '  ·  ' + it.dim;
  const h=document.getElementById('obsHint'); h.classList.remove('fade');
  setTimeout(()=>h.classList.add('fade'),4000);
  obs.classList.add('open');
}
document.querySelectorAll('[data-close]').forEach(b=>{
  b.addEventListener('click',()=>document.getElementById(b.dataset.close).classList.remove('open'));
});

/* anti-chevauchement */
let OBJS=[];
function overlaps(a,b){
  const rxa=a.foot[0]/2, rya=(a.foot[1]/2)*persp(a.y), rxb=b.foot[0]/2, ryb=(b.foot[1]/2)*persp(b.y);
  const nx=(a.x-b.x)/(rxa+rxb), ny=(a.y-b.y)/(rya+ryb); return (nx*nx+ny*ny)<1;
}
function collides(o){return OBJS.some(p=>p!==o&&overlaps(o,p));}
function enableDrag(o){
  o.el.addEventListener('pointerdown',e=>{
    e.preventDefault(); o.el.setPointerCapture(e.pointerId); o.el.classList.add('drag');
    OBJS.forEach(p=>p.el.classList.add('showfoot'));
    const rect=stage.getBoundingClientRect();
    const move=ev=>{
      let nx=((ev.clientX-rect.left)/rect.width)*100, ny=(1-(ev.clientY-rect.top)/rect.height)*100;
      nx=Math.max(6,Math.min(94,nx)); ny=Math.max(4,Math.min(56,ny));
      const px=o.x,py=o.y; o.x=nx; o.y=ny;
      if(collides(o)){o.x=px; o.y=py; o.el.classList.add('bad');} else {o.el.classList.remove('bad');}
      placeObj(o);
    };
    const up=()=>{o.el.releasePointerCapture(e.pointerId); o.el.classList.remove('drag','bad');
      OBJS.forEach(p=>p.el.classList.remove('showfoot'));
      o.el.removeEventListener('pointermove',move); o.el.removeEventListener('pointerup',up);};
    o.el.addEventListener('pointermove',move); o.el.addEventListener('pointerup',up);
  });
}

function clear(){layer.innerHTML=''; OBJS=[]; vitrine.classList.remove('open'); obs.classList.remove('open'); toggleC.style.display='none';}
const SCENES={
  A(){
    makeObj({x:24,y:40,art:'buste',scale:1.1}); makeObj({x:76,y:44,art:'papillon',scale:1});
    makeShelf({x:52,y:16,items:[['chaise','vase','cube'],['galet','buste','vase']],plaque:'Vitrine · 6 pièces'});
    cap.innerHTML=`<div class="q">Ce que tu vois</div>
      <div class="t">Une <b>étagère au sol</b> parmi deux socles, avec plaque et <b>halo lent</b>.</div>
      <div class="hint">À cette échelle on distingue mal les petits → le parcours de l'onglet B.</div>`;
  },
  B(){
    makeObj({x:24,y:42,art:'buste',scale:1.1});
    makeShelf({x:64,y:18,items:[['chaise','vase','cube'],['galet','buste','vase']],plaque:'Vitrine · 6 pièces',onTap:openVitrine});
    cap.innerHTML=`<div class="q">Le parcours (calqué sur une grande pièce)</div>
      <div class="t"><b>1.</b> Halo lent → tape l'étagère.<br>
      <b>2.</b> <b>Vitrine</b> = l'équivalent de la salle immersive : <b>immersif</b> → objets qui tournent, sinon photos (bouton en haut à droite).<br>
      <b>3.</b> Tape un objet → ta <b>salle d'observation</b> (bandes, objet plein écran à tourner, titre, matière + dimensions). La porte gauche « Vitrine » = retour à la provenance.</div>
      <div class="hint">Grande pièce : clic → immersive → bouton → observation. Étagère : clic → vitrine → clic objet → observation.</div>`;
  },
  C(){toggleC.style.display='flex'; renderC('mix');
    cap.innerHTML=`<div class="q">Salle mixte (ton choix)</div>
      <div class="t">Grandes pièces au sol + étagères ensemble. La bascule montre l'alternative « salle 100&nbsp;% vitrines ».</div>`;},
  D(){
    OBJS.push(makeObj({x:30,y:30,art:'buste',scale:1.1,foot:[26,12],drag:true}));
    OBJS.push(makeObj({x:66,y:30,art:'vase',scale:1.2,foot:[22,10],drag:true}));
    OBJS.push(makeObj({x:50,y:48,art:'papillon',scale:1,foot:[30,12],drag:true}));
    cap.innerHTML=`<div class="q">Drag libre + blocage dur</div>
      <div class="t">Tire une pièce. Halo <b style="color:var(--ok)">vert</b> = ça passe, <b style="color:var(--no)">rouge</b> = pas refusé. Empreinte <b>elliptique</b>, rétrécie vers le fond.</div>`;
  }
};
function renderC(kind){
  layer.innerHTML=''; OBJS=[];
  if(kind==='mix'){
    makeObj({x:22,y:42,art:'buste',scale:1.15}); makeObj({x:80,y:46,art:'papillon',scale:1});
    makeShelf({x:52,y:14,items:[['chaise','vase','cube'],['galet','buste','vase']],plaque:'Vitrine',onTap:openVitrine});
  }else{
    makeShelf({x:26,y:34,items:[['chaise','vase'],['cube','galet']],plaque:'Vitrine A',onTap:openVitrine});
    makeShelf({x:72,y:32,items:[['buste','vase'],['papillon','cube']],plaque:'Vitrine B',onTap:openVitrine});
    makeShelf({x:50,y:8,items:[['galet','chaise','vase'],['cube','buste','vase']],plaque:'Vitrine C',onTap:openVitrine});
  }
}
document.querySelectorAll('#toggleC button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#toggleC button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); renderC(b.dataset.c);
}));

function show(m){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m)); clear(); SCENES[m]();}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) show(t.dataset.m);});
show('B');
</script>
</body>
</html>
