<body class="theme-sombre">

  <div class="scene-entree">

    <header class="entete">
      <nav class="nav-pages">
        <a href="index.html" class="lien-contact">Accueil</a>
        <span class="nav-sep">|</span>
        <a href="infos.html" class="lien-contact">Infos</a>
        <span class="nav-sep">|</span>
        <a href="contact.html" class="lien-contact actif">Contact</a>
        <span class="nav-sep" id="sep-artistes" style="display:none">|</span>
        <div class="nav-dropdown" id="nav-artistes" style="display:none">
          <span class="lien-contact nav-dropdown-trigger">Artistes invités <span class="nav-arrow">▾</span></span>
          <div class="nav-dropdown-menu" id="nav-artistes-menu"></div>
        </div>
      </nav>
      </header>

    <main class="contenu-principal">
      <div class="encadre-titre">

        <h1 class="contact-titre">Contact</h1>
        <p class="contact-accroche">Pour tout renseignement</p>
        <div class="separateur"></div>

        <div class="contact-bloc">

          <div class="contact-item">
            <span class="contact-label">Courrier électronique</span>
            <div class="contact-email-wrap">
              <a class="lien-email" href="#"
                 data-u="ferette.frederique" data-d="gmail.com"
                 aria-label="Envoyer un email à Frédérique Ferette">
                ferette.frederique&#64;gmail.com
              </a>
              <button class="btn-copier" id="btnCopier" aria-label="Copier l'adresse email" title="Copier">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <span class="copie-ok">Copié !</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>

    <footer class="pied">
      <div class="signature-artiste" aria-label="Signature">FF</div>
      <span class="mention">&copy; Frédérique Ferette</span>
      <span class="mention" style="font-size:.62rem;opacity:.38;margin-top:.15rem;">Musique&nbsp;: <em>Pictures at an Exhibition</em> — Mussorgsky &middot; <a href="https://musopen.org/music/performer/alexander-ghindin/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">Alexander Ghindin</a> &middot; CC&nbsp;BY</span>
