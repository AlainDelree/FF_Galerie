<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu galerie</title>
  <link rel="stylesheet" href="assets/css/galerie-sculpture.css?v=20260624c">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #7a7a7a; user-select: none; -webkit-user-select: none; pointer-events: none; }
    .conteneur-salles { width: 100% !important; height: 100% !important; flex: 1 1 auto !important; min-height: 0 !important; display: flex !important; flex-direction: column !important; transform: none !important; }
    .salle {
      width: 100% !important;
      display: flex !important; flex-direction: column !important;
    }
    /* Chaîne flex complète (galerie.css non chargé en aperçu) : conteneur →
       salle → zone-basse → plancher en flex:1, sans 100vh/100svh (peu fiables
       en iframe). Annule aussi le padding-bottom mobile (réservé à la nav fixe,
       absente ici) qui laissait une zone morte « mur de la pièce » sous le sol. */
    .salle.salle-sculpture { flex: 1 1 auto !important; height: auto !important; min-height: 100dvh !important; padding-bottom: 0 !important; }
    .salle-sculpture .zone-basse { flex: 1 1 auto !important; min-height: 0 !important; }
    /* .salle-sculpture background : pas de règle ici — laissé au JS qui
       applique salle.couleur_mur_piece (default body #7a7a7a si absent). */
    .mur-inferieur { flex: 0 0 35px !important; height: 35px !important; }
    .plancher-sol {
      flex: 1 !important; min-height: 0 !important; max-height: none !important;
      position: relative !important;
    }
    .silhouettes-sol, .panneau-nav, .plaque-nav, .porte-mur, .porte-nav, .nav-cote, .nav-mobile, .barre-navigation, .dots, .salle-titre, .nom-salle { display: none !important; }
    .socle-wrapper { position: absolute; }
    /* Aperçu non-interactif : pas de clics, pas de curseur */
    .socle, .socle-wrapper { cursor: default !important; pointer-events: none !important; }
  </style>
</head>
<body data-page="galerie">
  <div class="conteneur-salles" id="conteneurSalles"></div>
  <script>
    window.GALERIE_TOILES_PATH = "data/oeuvres/sculpture.json";
    window.GALERIE_SALLES_PATH = "data/salles.json";
    window.GALERIE_ASSETS_BASE = "";
    /* Mode forcé via ?vue=pc|gsm — détermine PC ou GSM indépendamment de la taille réelle */
    var _vue = new URLSearchParams(location.search).get('vue');
    window._GALERIE_FORCE_MOBILE = (_vue === 'gsm') ? true : (_vue === 'pc') ? false : null;
    window._GALERIE_READONLY = true; /* aperçu : pas de clic vers la salle immersive */
    /* PAS _GALERIE_EDIT : read-only, aucun drag */
  </script>
  <script src="assets/js/galerie-core.js?v=20260708i"></script>
  <script src="assets/js/galerie-sculpture.js?v=20260708jDIAG"></script>
  <script>
    var _initDone = false;
    function _doInit() { if (_initDone) return; _initDone = true; initGalerie(); }
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'init-data' && !_initDone) {
        window._GALERIE_INJECTED = { toiles: e.data.toiles, salles: e.data.salles };
        _doInit();
      }
    });
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'iframe-awaiting-data' }, '*');
      setTimeout(_doInit, 800);
    } else {
      _doInit();
    }
  </script>
</body>
</html>
