<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Galerie — Frédérique Ferette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body.theme-sombre { --mur:#1c1c1c; --cadre:#3a3a3a; --cadre-in:rgba(255,255,255,.12); --fil:#555; }
    body.theme-provence .mur {
      background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuODUiIG51bU9jdGF2ZXM9IjQiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48ZmVDb2xvck1hdHJpeCB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMCAwIDAgMCAwICAwIDAgMCAwIDAgIDAgMCAwIDAgMCAgMCAwIDAgMC4xMyAwIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbHRlcj0idXJsKCNub2lzZSkiLz48L3N2Zz4=");
      background-repeat: repeat;
      background-size: 200px 200px;
    }
    /* ── LAYOUT GÉNÉRAL ── */
    .galerie-principale { display:flex; flex-direction:column; min-height:calc(100vh - 4.5rem - 2.8rem); background-color:var(--bg); overflow:hidden; }
    .scene-galerie { background-color:var(--bg); min-height:100vh; }
    .barre-navigation { display:flex; align-items:center; justify-content:center; gap:2rem; padding:1.1rem 2rem 0.5rem; }
    .indicateur-salle { font-family:Lato,sans-serif; font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; color:var(--text-doux); min-width:7rem; text-align:center; }
    .btn-nav-salle { background:none; border:1px solid var(--sep); color:var(--text-doux); width:2.4rem; height:2.4rem; border-radius:50%; cursor:pointer; font-size:1.4rem; display:flex; align-items:center; justify-content:center; transition:border-color .3s,color .3s,opacity .3s; }
    .btn-nav-salle:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .btn-nav-salle:disabled { opacity:.18; cursor:default; }
    .dots { display:flex; gap:.55rem; justify-content:center; padding:.3rem 0 .9rem; }
    .dot { width:5px; height:5px; border-radius:50%; background-color:var(--sep); transition:background-color .35s,transform .35s; }
    .dot.actif { background-color:var(--accent); transform:scale(1.4); }
    .conteneur-salles { display:flex; flex:1; width:400%; min-height:0; transition:transform .65s cubic-bezier(.77,0,.175,1); }
    .conteneur-salles.salle-2 { transform:translateX(-25%); }
    .conteneur-salles.salle-3 { transform:translateX(-50%); }
    .conteneur-salles.salle-4 { transform:translateX(-75%); }
    .nom-salle { font-family:"Playfair Display",serif; font-style:italic; font-size:.88rem; letter-spacing:.18em; color:var(--text-doux); margin-bottom:.8rem; text-align:center; }
    .tableau { cursor:pointer; display:flex; flex-direction:column; align-items:center; position:relative; z-index:2; transition:transform .3s ease,filter .3s ease; }
    .tableau:hover { transform:translateY(-5px); filter:brightness(1.06); }
    .tableau:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .cadre {
      border: 0; position:relative;
      /* Caisse américaine : bord extérieur sombre + surface plate + filet intérieur */
      outline: 2px solid rgba(0,0,0,.7);
      box-shadow:
        0 12px 40px rgba(0,0,0,.65),
        0 3px 10px rgba(0,0,0,.35),
        /* Relief extérieur */
        0 0 0 14px #3a3a3a,
        0 0 0 16px rgba(80,80,80,.6),
        /* Filet intérieur clair (retrait vers la toile) */
        inset 0 0 0 3px rgba(100,100,100,.5),
        inset 2px 2px 4px rgba(0,0,0,.6),
        inset -2px -2px 4px rgba(0,0,0,.4);
      margin: 16px;
    }
    .cadre::after { content:''; position:absolute; inset:0; border:3px solid rgba(255,255,255,.07); pointer-events:none; }
    .cadre img { display:block; object-fit:cover; }
    .placeholder { background:linear-gradient(135deg,rgba(0,0,0,.07),rgba(0,0,0,.02)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem; }
    .placeholder-num { font-family:"Playfair Display",serif; font-style:italic; font-size:3rem; color:var(--text-doux); opacity:.35; }
    .placeholder-txt { font-size:.65rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-doux); opacity:.4; }
    .etiquette { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:.35rem; text-align:center; max-width:100%; white-space:nowrap; }
    .plaquette {
      display:inline-block;
      max-width:100%;
      background: linear-gradient(180deg, #d4aa50 0%, #e8c860 30%, #c8980a 60%, #b88800 100%);
      padding:.3rem .75rem;
      border-radius:1px;
      border:1px solid rgba(180,130,0,.6);
      box-shadow: 0 2px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,250,180,.6);
      text-align:center;
    }
    .etiquette-titre {
      font-family:"Cinzel",serif;
      font-style:normal;
      font-weight:700;
      font-size:.68rem;
      color:#1a0e00;
      letter-spacing:.06em;
      text-transform:uppercase;
      white-space:normal;
      word-break:break-word;
      max-width:100%;
      line-height:1.3;
    }
    .etiquette-date { font-size:.7rem; color:var(--text-doux); margin-top:.15rem; letter-spacing:.06em; }

    /* ============================================================
       MODES DE NAVIGATION A / C
       ============================================================ */
    [data-nav] .barre-navigation,
    [data-nav] .dots { display:none; }

    
    
    
    .salle { width:25%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:1rem 2rem 0; min-height:0; position:relative; }

    /* ── MUR : overflow visible pour que rien ne soit coupé ── */
    .mur { background-color:var(--mur); border-radius:3px; width:100%; max-width:1080px; height:420px; flex:none; overflow:visible; display:flex; align-items:center; justify-content:center; gap:2rem; flex-wrap:nowrap; padding:0 2.5rem; position:relative; box-shadow:inset 0 80px 80px rgba(0,0,0,.06), 0 0 0 0 transparent; }

    /* Ombres intérieures du mur séparées du mur lui-même */
    .mur::before { content:''; position:absolute; inset:0; border-radius:3px; background: linear-gradient(to bottom, rgba(0,0,0,.10) 0%, transparent 25%, transparent 75%, rgba(0,0,0,.12) 100%); pointer-events:none; z-index:0; }

    /* Plinthe en bas du mur */
    .mur::after { content:''; position:absolute; bottom:0; left:0; right:0; height:14px; background:linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,.45)); border-top:1px solid rgba(0,0,0,.30); pointer-events:none; z-index:1; }

    /* Spot lumineux — visible seulement en mode sombre */
    .cadre::before { content:''; display:none; position:absolute; top:-85px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:rgba(255,250,210,1); box-shadow:0 0 8px 4px rgba(255,240,160,.7), 0 0 20px 10px rgba(255,230,120,.3); pointer-events:none; z-index:3; }
    /* Halo de lumière diffus — pas de triangle */
    .cadre::after { content:''; display:none; position:absolute; top:-85px; left:50%; transform:translateX(-50%); width:1px; height:1px; pointer-events:none; z-index:0;
      box-shadow:
        0 20px 40px 60px rgba(255,240,160,.06),
        0 40px 80px 40px rgba(255,235,140,.04),
        0 70px 100px 20px rgba(255,230,120,.02);
    }
    /* Activer spots uniquement en mode sombre */
    body.theme-sombre .cadre::before,
    body.theme-sombre .cadre::after { display:block; }

    /* Ombre portée au sol sous chaque cadre */
    .tableau::after { content:''; position:absolute; bottom:-14px; left:8%; width:84%; height:12px; background:radial-gradient(ellipse, rgba(0,0,0,.45) 0%, rgba(0,0,0,.15) 50%, transparent 72%); filter:blur(3px); pointer-events:none; }

    /* ── PARQUET : simple, sans clip-path, sans overflow ── */

    /* ── PORTES : collées à l'extérieur du mur, alignées en bas ── */
    .porte {
      display:none; flex-direction:column; align-items:center;
      cursor:pointer; user-select:none;
      position:absolute;
      bottom:0;
      z-index:10;
    }
    .porte-g { right:100%; }
    .porte-d { left:100%; }
    .porte.invisible { opacity:0; pointer-events:none; }
    [data-nav="c"] .porte { display:flex; }

    .porte-nom {
      font-family:Lato,sans-serif; font-style:normal; font-weight:400;
      font-size:.75rem; letter-spacing:.07em; color:var(--text-doux);
      margin-bottom:.4rem; white-space:nowrap;
      background:rgba(255,255,255,.07); padding:.1rem .45rem; border-radius:2px;
      text-shadow:0 1px 4px rgba(0,0,0,.9);
      transition:color .3s, background .3s;
    }
    .porte:hover .porte-nom { color:var(--accent); background:rgba(255,255,255,.11); }

    .porte-forme {
      width:44px; height:71px; border-radius:22px 22px 0 0;
      background:var(--cadre); position:relative;
      border:1px solid rgba(255,255,255,.18); border-bottom:none;
      transition:border-color .35s;
    }
    .porte-interieur {
      position:absolute; inset:3px 3px 0; border-radius:19px 19px 0 0;
      background:radial-gradient(ellipse at 50% 115%, rgba(255,238,160,.18) 0%, rgba(0,0,0,.88) 65%);
    }
    .porte:hover .porte-forme {
      border-color:rgba(255,255,255,.32);
      box-shadow:0 0 14px 4px var(--accent);
    }
    /* Chevron directionnel dans l'ouverture */
    .porte-fleche {
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      font-size:.9rem; color:rgba(255,255,255,.20); transition:color .3s;
      pointer-events:none;
    }
    .porte:hover .porte-fleche { color:rgba(255,255,255,.55); }


    /* ── Mode grille (admin positions) : tous supports ── */
    .mur.mur-grille {
      display: grid !important;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      aspect-ratio: 12/8;
      width: 100%;
      height: auto !important;
      padding: 6px !important;
      gap: 3px !important;
      overflow: visible;
    }
    .tableau-grille {
      width: 100% !important;
      height: 100% !important;
      position: relative;
      cursor: pointer;
      display: block;
    }
    .tableau-grille:hover { filter: brightness(1.07); }
    .tableau-grille .cadre-grille {
      position: absolute; inset: 0; margin: 0;
      overflow: hidden; border-radius: 2px;
      box-shadow: 0 4px 16px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.08);
      outline: none;
    }
    .tableau-grille .cadre-grille img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .tableau-grille .tg-titre {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.68);
      font-family: 'Cinzel', serif;
      font-size: clamp(6px, 1.2vw, 11px);
      color: #e8d8b8;
      text-align: center;
      padding: 1px 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    /* Salle avec espace pour portes */
    .salle.salle-grille {
      padding-left: 0;
      padding-right: 0;
    }

    /* Pas de plinthe en mode grille (le plancher la remplace) */
    .mur.mur-grille::after { display:none; }
    /* Cache les vieilles portes latérales en mode grille */
    .mur.mur-grille > .porte { display:none !important; }
    /* Titre toile au-dessus de la plinthe en mode classique */
    .tg-titre { bottom: 0; }


    /* ── Zone basse galerie (mur-inférieur + sol) ── */
    .zone-basse { width:100%; display:flex; flex-direction:column; }

    /* Mur inférieur : continuation du mur, contient les portes */
    .mur-inferieur {
      width:100%; height:70px;
      display:flex; align-items:flex-end; justify-content:space-between;
      position:relative;
      background:inherit; /* hérite la couleur du mur parent */
      border-top: 1px solid rgba(0,0,0,.3);
    }
    /* Ombre intérieure haut mur inférieur */
    .mur-inferieur::before {
      content:''; position:absolute; top:0; left:0; right:0; height:18px;
      background:linear-gradient(to bottom, rgba(0,0,0,.18), transparent);
      pointer-events:none;
    }
    /* Plinthe en bas du mur inférieur */
    .mur-inferieur::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:10px;
      background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.5));
      border-top:1px solid rgba(0,0,0,.4); pointer-events:none;
    }

    /* Portes dans le mur inférieur */
    .porte-mur {
      flex-shrink:0; width:48px; height:66px;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      cursor:pointer; background:none; border:none; padding:0; z-index:2;
      transition:filter .2s;
    }
    .porte-mur:hover { filter:brightness(1.25); }
    .porte-mur.invisible { opacity:0; pointer-events:none; }
    .pm-ouverture {
      width:36px; height:56px; border-radius:18px 18px 0 0;
      background: radial-gradient(ellipse at 50% 120%,
        rgba(255,220,120,.12) 0%, rgba(0,0,0,.92) 55%);
      border:1px solid rgba(255,255,255,.15); border-bottom:none;
      position:relative; overflow:hidden;
    }
    .pm-ouverture::after {
      content:''; position:absolute; inset:3px 3px 0;
      border-radius:15px 15px 0 0;
      background:radial-gradient(ellipse at 50% 120%, rgba(255,235,160,.08) 0%, rgba(0,0,0,.95) 55%);
    }
    .pm-nom {
      font-family:Lato,sans-serif; font-size:.52rem; letter-spacing:.07em;
      color:rgba(255,255,255,.3); white-space:nowrap; margin-bottom:.25rem;
      transition:color .2s;
    }
    .porte-mur:hover .pm-nom { color:var(--accent); }
    .pm-fleche {
      position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
      font-size:.8rem; color:rgba(255,255,255,.2); z-index:1; transition:color .2s;
    }
    .porte-mur:hover .pm-fleche { color:rgba(255,255,255,.6); }

    /* Sol parquet */
    .plancher-sol {
      width:100%; height:75px;
      background: linear-gradient(to bottom,
        rgba(28,18,8,.92) 0%, rgba(38,25,12,.98) 100%);
      position:relative; overflow:hidden;
      display:flex; align-items:flex-end;
    }
    /* Lattes parquet */
    .plancher-sol::before {
      content:''; position:absolute; inset:0;
      background:
        repeating-linear-gradient(90deg, transparent 0, transparent 44px, rgba(0,0,0,.12) 44px, rgba(0,0,0,.12) 45px),
        repeating-linear-gradient(to bottom, transparent 0, transparent 14px, rgba(255,255,255,.025) 14px, rgba(255,255,255,.025) 15px);
      pointer-events:none;
    }
    /* Reflet du mur sur le sol */
    .plancher-sol::after {
      content:''; position:absolute; top:0; left:0; right:0; height:20px;
      background:linear-gradient(to bottom, rgba(255,255,255,.04), transparent);
      pointer-events:none;
    }
    .silhouettes-sol { width:100%; position:relative; z-index:1; }

    /* ── Plancher galerie (ancien, conservé pour compatibilité) ── */
    .plancher-galerie {
      width: 100%;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      overflow: hidden;
      background: linear-gradient(to bottom,
        rgba(0,0,0,.35) 0%,
        rgba(20,15,10,.6) 40%,
        rgba(30,22,14,.85) 100%);
      border-top: 1px solid rgba(0,0,0,.4);
    }
    /* Reflet du mur sur le sol */
    .plancher-galerie::before {
      content:'';
      position:absolute;
      top:0; left:0; right:0; height:18px;
      background: linear-gradient(to bottom, rgba(255,255,255,.04), transparent);
      pointer-events:none;
    }
    /* Latte de parquet subtile */
    .plancher-galerie::after {
      content:'';
      position:absolute;
      inset:0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0, transparent 39px,
        rgba(0,0,0,.08) 39px, rgba(0,0,0,.08) 40px
      );
      pointer-events:none;
    }
    .silhouettes-zone {
      flex:1;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      z-index:1;
    }
    .silhouettes-zone svg { width:100%; }

    /* Portes dans le plancher */
    .porte-plancher {
      flex-shrink:0;
      width:42px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      cursor:pointer;
      z-index:2;
      background:none;
      border:none;
      padding:0;
      transition:filter .2s;
      position:relative;
    }
    .porte-plancher:hover { filter:brightness(1.3); }
    .porte-plancher.invisible { opacity:0; pointer-events:none; }
    .pp-arc {
      width:32px;
      height:52px;
      border-radius:16px 16px 0 0;
      background: radial-gradient(ellipse at 50% 110%,
        rgba(200,160,80,.15) 0%,
        rgba(0,0,0,.85) 65%);
      border: 1px solid rgba(255,255,255,.18);
      border-bottom:none;
      position:relative;
    }
    .pp-arc::after {
      content:'';
      position:absolute;
      inset:3px 3px 0;
      border-radius:13px 13px 0 0;
      background: radial-gradient(ellipse at 50% 115%,
        rgba(255,235,150,.12) 0%,
        rgba(0,0,0,.9) 60%);
    }
    .pp-nom {
      font-family:Lato,sans-serif;
      font-size:.52rem;
      letter-spacing:.07em;
      color:rgba(255,255,255,.35);
      white-space:nowrap;
      margin-bottom:.2rem;
      transition:color .2s;
    }
    .porte-plancher:hover .pp-nom { color:var(--accent); }
    .pp-fleche {
      position:absolute;
      bottom:6px; left:50%; transform:translateX(-50%);
      font-size:.75rem;
      color:rgba(255,255,255,.18);
      transition:color .2s;
      z-index:1;
    }
    .porte-plancher:hover .pp-fleche { color:rgba(255,255,255,.55); }

    
  </style>
</head>
  <style>
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; pointer-events:none; transition:opacity .35s ease; padding:1.5rem; }
    .modal-overlay.visible { opacity:1; pointer-events:all; }
    .modal-contenu { background-color:var(--bg); border:1px solid var(--sep); max-width:880px; width:100%; max-height:92vh; overflow-y:auto; display:flex; position:relative; transform:scale(.94); transition:transform .35s ease; }
    .modal-overlay.visible .modal-contenu { transform:scale(1); }
    .modal-image-wrap { flex:0 0 55%; max-height:88vh; overflow:hidden; display:flex; align-items:center; justify-content:center; background-color:var(--bg); }
    .modal-image-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
    .modal-placeholder-grand { width:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(0,0,0,.06),rgba(0,0,0,.02)); font-family:"Playfair Display",serif; font-style:italic; font-size:5rem; color:var(--text-doux); opacity:.28; min-height:300px; }
    .modal-fiche { flex:1; padding:2.4rem 2rem 2rem; display:flex; flex-direction:column; gap:1rem; }
    .modal-titre { font-family:"Playfair Display",serif; font-weight:400; font-style:italic; font-size:1.55rem; color:var(--text); line-height:1.25; }
    .modal-separateur { width:2.2rem; height:1px; background-color:var(--sep); margin:-.2rem 0 .2rem; }
    .modal-ligne { display:flex; flex-direction:column; gap:.12rem; }
    .modal-label { font-size:.66rem; letter-spacing:.17em; text-transform:uppercase; color:var(--text-doux); }
    .modal-valeur { font-size:.9rem; color:var(--text); }
    .modal-fermer { position:absolute; top:.85rem; right:.85rem; background:none; border:1px solid var(--sep); color:var(--text-doux); width:2rem; height:2rem; border-radius:50%; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; z-index:1; transition:border-color .3s,color .3s; }
    .modal-fermer:hover { border-color:var(--accent); color:var(--accent); }
    @media (max-width:900px) { .mur { gap:1.5rem; padding:3rem 1.5rem 2rem; } }
    /* Navigation mobile flèches */
    .nav-mobile {
      display:none;
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background:rgba(17,17,17,.95);
      padding:.8rem 0;
      justify-content:center;
      z-index:50;
      gap:.8rem;
      align-items:center;
    }
    .nav-mobile-btn {
      background:rgba(20,20,20,.85);
      border:1px solid var(--sep);
      color:var(--accent);
      width:3rem; height:3rem;
      border-radius:50%;
      font-size:1.4rem;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(6px);
      transition:background .3s, border-color .3s;
    }
    .nav-mobile-btn:disabled { opacity:.2; pointer-events:none; }
    .nav-mobile-btn:hover { background:rgba(40,40,40,.95); border-color:var(--accent); }
    .nav-mobile-info {
      font-family:"Playfair Display",serif;
      font-style:italic;
      font-size:.75rem;
      color:var(--text-doux);
      letter-spacing:.1em;
      min-width:4rem;
      text-align:center;
    }
    @media (max-width:700px) {
      .mur { gap:1rem; padding:2rem 1rem 1.5rem; min-height:auto; flex-wrap:wrap; height:auto; }
      /* Modal en feuille descendante sur mobile — toile en haut */
      .modal-overlay { padding:0; align-items:flex-start; }
      .modal-contenu { flex-direction:column; border-radius:0 0 16px 16px; max-height:90vh; width:100%; }
      /* Indicateur de glissement en bas (swipe bas = fermer) */
      .modal-contenu::before { display:none; }
      .modal-contenu::after { content:''; display:block; width:40px; height:4px; background:rgba(255,255,255,.18); border-radius:2px; margin:.6rem auto; flex-shrink:0; order:99; }
      .modal-image-wrap { flex:none; width:100%; height:auto; max-height:58vh; display:flex; align-items:center; justify-content:center; background-color:var(--bg); }
      .modal-image-wrap img { width:auto !important; height:auto !important; max-width:100%; max-height:58vh; object-fit:contain; display:block; }
      .modal-fiche { padding:1.2rem 1.2rem 1rem; gap:.7rem; }
      /* Bouton fermer plus grand sur mobile */
      .modal-fermer { width:2.8rem; height:2.8rem; font-size:1.3rem; }
      .etiquette { margin-top:.8rem; }
      .plaquette { padding:.25rem .5rem; }
      .etiquette-titre { font-size:.62rem; letter-spacing:.04em; }
    }
    @media (max-width:600px) {
      .galerie-principale { height:auto !important; min-height:unset !important; }
      .conteneur-salles { height:auto !important; min-height:unset !important; align-items:flex-start; }
      /* Règle salle unifiée : padding-bottom = hauteur nav (~60px) + home indicator iOS */
      .salle { height:auto !important; min-height:unset !important; padding:.5rem .3rem calc(5rem + env(safe-area-inset-bottom, 0px)); }
      /* Navigation mobile */
      .nav-mobile { display:flex !important; padding-bottom:calc(.8rem + env(safe-area-inset-bottom, 0px)); }
      body { overflow-x:hidden; }
      /* Mur grille sur mobile : laisse de la place pour les portes */
      .mur.mur-grille {
        display:grid !important;
        grid-template-columns:repeat(12,1fr) !important;
        grid-template-rows:repeat(8,1fr) !important;
        aspect-ratio:12/8 !important;
        width:calc(100% - 56px) !important;
        height:auto !important;
        min-height:unset !important;
        padding:5px !important;
        gap:2px !important;
        margin:0 auto;
        overflow:visible !important;
      }
      /* Portes visibles en mode grille sur mobile */
      .mur.mur-grille .porte { display:flex !important; }
      .mur.mur-grille .porte-forme { width:24px; height:42px; }
      .mur.mur-grille .porte-nom { font-size:.52rem; }
      /* Mur flux classique sur mobile : 2 colonnes */
      .mur:not(.mur-grille) {
        display:grid; grid-template-columns:1fr 1fr; justify-items:center;
        align-content:space-evenly; column-gap:.5rem; row-gap:0;
        padding:1rem .7rem; min-height:calc(100vh - 220px); height:auto !important; overflow:visible;
      }
      .cadre { margin:8px; box-shadow:0 8px 28px rgba(0,0,0,.65), 0 0 0 8px #3a3a3a, 0 0 0 9px rgba(80,80,80,.45), inset 0 0 0 2px rgba(100,100,100,.35), inset 1px 1px 3px rgba(0,0,0,.5); }
      .cadre::before, .cadre::after { display:none !important; }
      .tableau { flex-shrink:0; }
      .tableau::after { bottom:-8px; }
      .etiquette { position:absolute; top:100%; left:0; right:0; transform:none; margin-top:.3rem; display:flex; justify-content:center; }
      .etiquette-titre { font-size:.65rem; letter-spacing:.03em; }
      .plaquette { padding:.25rem .5rem; }
    }
  </style>
</head>
<body class="theme-sombre" data-page="galerie" style="background-color:#111111;">

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitre">

  </footer>



  <script src="assets/js/main.js"></script>
  <script>
    let salleCourante = 1;
    const TOTAL_SALLES = 4;
    const NOMS_ROMAINS = ['I', 'II', 'III', 'IV'];
    const conteneur  = document.getElementById('conteneurSalles');
    const btnPrev    = document.getElementById('btnPrecedent');
    const btnNext    = document.getElementById('btnSuivant');
    const numSalleEl = document.getElementById('numSalle');
    const dotsEl     = document.querySelectorAll('.dot');
    let navMode = 'c';

    /* --- Portes mode C : injection dans chaque mur --- */
    for (let i = 1; i <= TOTAL_SALLES; i++) {
      const cible = document.getElementById('mur' + i);
      ['g', 'd'].forEach(cote => {
        const p = document.createElement('div');
        p.className = 'porte porte-' + cote + ' invisible';
        p.dataset.murId = i;
        p.dataset.cote  = cote;
        p.innerHTML =
          '<span class="porte-nom"></span>' +
          '<div class="porte-forme"><div class="porte-interieur"></div>' +
          '<span class="porte-fleche">' + (cote === 'g' ? '&#8249;' : '&#8250;') + '</span>' +
          '</div>';
        p.addEventListener('click', () => {
          const cible = p.dataset.cible;
          if (cible === 'accueil') { window.location.href = 'index.html'; return; }
          const n = parseInt(cible);
          if (n >= 1 && n <= TOTAL_SALLES) allerSalle(n);
        });
        cible.appendChild(p);
      });
    }

    function mettreAJourNav() {
      /* Navigation mobile */
      const mobG = document.getElementById('navMobG');
      const mobD = document.getElementById('navMobD');
      const mobInfo = document.getElementById('navMobInfo');
      if (mobG) mobG.disabled = salleCourante === 1;
      if (mobD) mobD.disabled = salleCourante === TOTAL_SALLES;
      if (mobInfo) mobInfo.textContent = NOMS_ROMAINS[salleCourante-1] + ' / ' + NOMS_ROMAINS[TOTAL_SALLES-1];
      /* Flèches mode A */

      /* Pastille */
      const pastille = document.getElementById('navPastille');
      if (pastille) pastille.textContent =
        'Salle ' + NOMS_ROMAINS[salleCourante - 1] + ' / ' + NOMS_ROMAINS[TOTAL_SALLES - 1];

      /* Mini dots */
      document.querySelectorAll('.ndot').forEach((d, i) => d.classList.toggle('actif', i + 1 === salleCourante));

      /* Portes mode C */
      document.querySelectorAll('.porte').forEach(p => {
        const murId = parseInt(p.dataset.murId);
        const cote  = p.dataset.cote;

        /* Porte de sortie : dernière salle côté droit → Accueil */
        if (murId === TOTAL_SALLES && cote === 'd') {
          p.classList.remove('invisible');
          p.dataset.cible = 'accueil';
          p.querySelector('.porte-nom').textContent = '← Accueil';
          return;
        }

        const cible  = cote === 'g' ? murId - 1 : murId + 1;
        p.dataset.cible = cible;
        const visible = cible >= 1 && cible <= TOTAL_SALLES;
        p.classList.toggle('invisible', !visible);
        if (visible) {
          const nom = 'Salle ' + NOMS_ROMAINS[cible - 1];
          p.querySelector('.porte-nom').textContent =
            cote === 'g' ? '← ' + nom : nom + ' →';
        }
      });
    }

    function allerSalle(n) {
      salleCourante = Math.max(1, Math.min(TOTAL_SALLES, n));
      conteneur.className = 'conteneur-salles' + (salleCourante > 1 ? ' salle-' + salleCourante : '');
      numSalleEl.textContent = salleCourante;
      btnPrev.disabled = salleCourante === 1;
      btnNext.disabled = salleCourante === TOTAL_SALLES;
      dotsEl.forEach((d, i) => d.classList.toggle('actif', i + 1 === salleCourante));
      mettreAJourNav();
    }

    btnPrev.addEventListener('click', () => allerSalle(salleCourante - 1));
    btnNext.addEventListener('click', () => allerSalle(salleCourante + 1));

    /* Mode C permanent */
    document.body.setAttribute('data-nav', 'c');
    mettreAJourNav();

    const hashSalle = parseInt((window.location.hash.match(/^#salle-([2-4])$/) || [])[1]);
    if (hashSalle) {
      conteneur.style.transition = 'none';
      allerSalle(hashSalle);
      conteneur.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        conteneur.style.transition = '';
      }));
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('modalOverlay').classList.contains('visible')) {
        if (e.key === 'Escape') fermerModal();
        return;
      }
      if (e.key === 'ArrowRight') allerSalle(salleCourante + 1);
      if (e.key === 'ArrowLeft')  allerSalle(salleCourante - 1);
    });

    let touchX = null;
    conteneur.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    conteneur.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 55) allerSalle(salleCourante + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    const modalOverlay = document.getElementById('modalOverlay');

    // Hauteur plancher selon largeur écran
    function hauteurPlancher() {
      return window.innerWidth <= 600 ? 90 : 110;
    }

    function creerPlancher(salleId, totalSalles, nomsRomains, couleurMur) {
      const zone = document.createElement('div');
      zone.className = 'zone-basse';

      // ── Mur inférieur avec portes ──
      const murBas = document.createElement('div');
      murBas.className = 'mur-inferieur';
      murBas.style.backgroundColor = '#111'; // Mur périphérique toujours sombre

      function makePorte(cote) {
        const btn = document.createElement('button');
        btn.className = 'porte-mur';
        const estGauche = cote === 'g';
        const cibleId = estGauche ? salleId - 1 : salleId + 1;
        const visible = estGauche ? salleId > 1 : true;
        if (!visible) { btn.className += ' invisible'; }
        let nom = '';
        if (!estGauche && salleId >= totalSalles) nom = 'Accueil →';
        else if (estGauche && salleId > 1) nom = '← Salle ' + nomsRomains[salleId - 2];
        else if (!estGauche && salleId < totalSalles) nom = 'Salle ' + nomsRomains[salleId] + ' →';
        btn.innerHTML = '<span class="pm-nom">' + nom + '</span>' +
          '<div class="pm-ouverture"><span class="pm-fleche">' + (estGauche ? '‹' : '›') + '</span></div>';
        btn.addEventListener('click', () => {
          if (!estGauche && salleId >= totalSalles) window.location.href = 'index.html';
          else allerSalle(cibleId);
        });
        return btn;
      }

      murBas.appendChild(makePorte('g'));
      murBas.appendChild(document.createElement('div')); // centre vide
      murBas.appendChild(makePorte('d'));
      zone.appendChild(murBas);

      // ── Sol parquet avec silhouettes ──
      const sol = document.createElement('div');
      sol.className = 'plancher-sol';
      const sv = document.createElement('div');
      sv.className = 'silhouettes-sol';
      sv.innerHTML = `<svg viewBox="0 0 380 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:block;width:100%;vertical-align:bottom">
  <g fill="rgba(5,3,1,.82)">

    <!-- VISITEUR A : femme, cheveux relevés, bras légèrement levé (x=68) -->
    <ellipse cx="68" cy="8" rx="10" ry="11"/>
    <circle cx="75" cy="3" r="5"/>
    <rect x="65" y="18" width="6" height="5" rx="1"/>
    <path d="M55 23 Q53 37 54 50 Q60 53 68 52 Q76 53 82 50 Q83 37 81 23 Q75 20 61 20 Z"/>
    <path d="M55 24 Q49 30 48 44 Q51 47 54 45 Q55 33 57 26 Z"/>
    <path d="M81 23 Q88 27 90 40 Q87 43 84 41 Q83 30 80 26 Z"/>
    <path d="M56 50 Q54 62 54 80 L61 80 Q63 67 68 58 Q73 67 75 80 L82 80 Q82 62 80 50 Z"/>
    <ellipse cx="68" cy="79" rx="16" ry="2.5" fill="rgba(0,0,0,.45)"/>

    <!-- VISITEUR B : homme, costume, mains dans le dos (x=192) -->
    <ellipse cx="192" cy="8" rx="12" ry="13"/>
    <rect x="188" y="20" width="8" height="6" rx="1"/>
    <path d="M174 26 Q171 41 172 58 Q179 62 192 61 Q205 62 212 58 Q213 41 210 26 Q203 22 181 22 Z"/>
    <path d="M174 27 Q167 34 166 51 Q169 54 173 52 Q174 38 176 29 Z"/>
    <path d="M210 27 Q217 34 218 51 Q215 54 211 52 Q210 38 208 29 Z"/>
    <path d="M175 59 Q173 68 173 80 L179 80 Q182 69 186 61 Q186 69 189 80 L195 80 Q198 69 198 61 Q202 69 205 80 L211 80 Q211 68 209 59 Z"/>
    <ellipse cx="192" cy="79" rx="20" ry="3" fill="rgba(0,0,0,.45)"/>

    <!-- VISITEUR C : personne plus petite, bras croisés (x=308) -->
    <ellipse cx="308" cy="11" rx="9" ry="11"/>
    <rect x="305" y="22" width="6" height="4" rx="1"/>
    <path d="M295 26 Q293 38 294 51 Q299 54 308 53 Q317 54 322 51 Q323 38 321 26 Q315 23 301 23 Z"/>
    <path d="M295 28 Q289 34 289 46 Q292 48 295 46 Q295 37 297 30 Z"/>
    <path d="M321 28 Q327 34 327 46 Q324 48 321 46 Q319 37 319 30 Z"/>
    <path d="M292 40 Q308 45 324 40 Q322 49 308 50 Q294 49 292 40 Z"/>
    <path d="M296 51 Q294 62 294 80 L300 80 Q302 69 306 61 Q306 69 309 80 L315 80 Q318 69 318 61 Q322 69 324 80 L330 80 Q330 62 328 51 Z"/>
    <ellipse cx="308" cy="79" rx="15" ry="2.5" fill="rgba(0,0,0,.45)"/>

  </g>
</svg>`;
      sol.appendChild(sv);
      zone.appendChild(sol);
      return zone;
    }

    function ouvrirModal(toile) {
      document.getElementById('modalTitre').textContent = toile.titre || 'Sans titre';
      document.getElementById('modalDate').textContent  = toile.date  || '—';
      document.getElementById('modalStyle').textContent = toile.style || '—';
      document.getElementById('modalMateriaux').textContent =
        (toile.materiaux && toile.materiaux.length) ? toile.materiaux.join(', ') : '—';
      const dim = toile.dimensions;
      document.getElementById('modalDimensions').textContent =
        (dim && dim.format) ? dim.format + ' — ' + dim.largeur + ' × ' + dim.hauteur + ' cm' : '—';
      const descLigne = document.getElementById('modalDescLigne');
      const descVal   = document.getElementById('modalDesc');
      if (toile.description) { descVal.textContent = toile.description; descLigne.style.display = ''; }
      else { descLigne.style.display = 'none'; }
      const wrap = document.getElementById('modalImageWrap');
      if (toile.photo) {
        wrap.innerHTML = '<img src="' + toile.photo + '" alt="' + (toile.titre || 'Toile') + '">';
      } else {
        wrap.innerHTML = '<div class="modal-placeholder-grand">' + toile.id + '</div>';
      }
      modalOverlay.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function fermerModal() {
      modalOverlay.classList.remove('visible');
      document.body.style.overflow = '';
    }

    document.getElementById('modalFermer').addEventListener('click', fermerModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) fermerModal(); });

    /* Swipe bas pour fermer le modal (mobile) */
    let swipeStartY = null;
    const modalContenu = document.querySelector('.modal-contenu');
    modalContenu.addEventListener('touchstart', e => { swipeStartY = e.touches[0].clientY; }, { passive:true });
    modalContenu.addEventListener('touchend', e => {
      if (swipeStartY === null) return;
      const dy = e.changedTouches[0].clientY - swipeStartY;
      if (dy > 80) fermerModal();
      swipeStartY = null;
    }, { passive:true });

    function creerTableau(toile, H) {
      H = H || 200;
      const dim = toile.dimensions;
      const isMob = window.innerWidth <= 600;
      const maxW = isMob ? Math.floor((document.querySelector('.mur').clientWidth - 44) / 2) - 16 : 99999;
      let W = (dim && dim.largeur && dim.hauteur) ? Math.round(H * dim.largeur / dim.hauteur) : H;
      W = Math.min(W, maxW);
      const art = document.createElement('article');
      art.style.width = (W + (isMob ? 16 : 26)) + 'px';
      art.className = 'tableau';
      art.tabIndex  = 0;
      art.setAttribute('role', 'button');
      art.setAttribute('aria-label', (toile.titre || 'Sans titre') + (toile.date ? ', ' + toile.date : ''));
      const cadre = document.createElement('div');
      cadre.className = 'cadre';
      if (toile.photo) {
        const img = document.createElement('img');
        img.src = toile.photo; img.alt = toile.titre || 'Toile'; img.loading = 'lazy';
        img.style.width      = W + 'px';
        img.style.height     = H + 'px';
        img.style.objectFit  = 'cover';
        img.style.display    = 'block';
        cadre.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.style.width  = W + 'px';
        ph.style.height = H + 'px';
        ph.innerHTML = '<span class="placeholder-num">' + toile.id + '</span><span class="placeholder-txt">Sans photo</span>';
        cadre.appendChild(ph);
      }
      const etiq = document.createElement('div');
      etiq.className = 'etiquette';
      const plaq = document.createElement('div');
      plaq.className = 'plaquette';
      const titreDiv = document.createElement('div');
      titreDiv.className = 'etiquette-titre';
      titreDiv.textContent = toile.titre || '';
      plaq.appendChild(titreDiv);
      if (toile.date) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'etiquette-date';
        dateDiv.textContent = toile.date;
        plaq.appendChild(dateDiv);
      }
      /* Plaquette : largeur max = largeur du cadre (évite la troncature sur mobile) */
      plaq.style.maxWidth = (W + 2) + 'px';
      etiq.appendChild(plaq);
      art.appendChild(cadre);
      art.appendChild(etiq);
      /* Masque la plaquette si ni titre ni date */
      if (!toile.titre && !toile.date) etiq.style.display = 'none';
      const ouvrir = () => ouvrirModal(toile);
      art.addEventListener('click', ouvrir);
      art.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(); } });
      return art;
    }

    Promise.all([
      fetch('data/toiles.json?v=' + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/salles.json?v=' + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    ])
    .then(([tData, sData]) => {
      const toileMap = {};
      (tData.toiles || []).filter(t => t.visible !== false).forEach(t => { toileMap[t.id] = t; });

      (sData.salles || []).forEach(salle => {
        const mur = document.getElementById('mur' + salle.id);
        if (!mur) return;

        // Applique couleur/texture du mur depuis l'admin
        if (salle.couleur_mur) mur.style.backgroundColor = salle.couleur_mur;

        // Détermine la couleur des cadres
        const couleurCadres = salle.couleur_cadres || '#3a3a3a';

        const positions = salle.positions || [];
        const toilesSalle = (salle.toiles || []).map(id => toileMap[id]).filter(Boolean);
        if (!toilesSalle.length) return;

        // ── MODE GRILLE (positions définies dans l'admin) ──────────
        if (positions.length > 0) {
          const toilesPosees = positions.map(p => toileMap[p.id]).filter(Boolean);
          if (!toilesPosees.length) return;

          // Supprime les vieilles portes latérales (remplacées par zone-basse)
          mur.querySelectorAll('.porte').forEach(p => p.remove());
          // Active la classe grille sur le mur et la salle
          mur.classList.add('mur-grille');
          const salleEl = mur.closest('.salle');
          if (salleEl) salleEl.classList.add('salle-grille');

          // Texture du mur
          const textures = {
            tissu: 'repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 1px,transparent 0,transparent 4px)',
            bois:  'repeating-linear-gradient(rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 1px,transparent 0,transparent 3px)',
            pierre:'repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 1px,transparent 0,transparent 6px)',
            damier:'repeating-conic-gradient(rgba(255,255,255,.03) 0% 25%,transparent 0% 50%) 0 0/8px 8px',
            parquet:'repeating-linear-gradient(90deg,rgba(74,56,40,.5) 0,rgba(74,56,40,.5) 2px,rgba(58,40,24,.5) 0,rgba(58,40,24,.5) 8px)',
            velours:'radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/5px 5px',
            brique: 'repeating-conic-gradient(rgba(0,0,0,.08) 0% 25%,rgba(255,255,255,.03) 0% 50%) 0 0/8px 8px'
          };
          if (salle.texture && salle.texture !== 'none' && textures[salle.texture]) {
            mur.style.background = textures[salle.texture] + ', ' + (salle.couleur_mur || '#2e2e2e');
          }

          // Place chaque toile selon sa position dans la grille
          positions.forEach(p => {
            const t = toileMap[p.id]; if (!t) return;
            const art = document.createElement('article');
            art.className = 'tableau-grille';
            art.style.gridColumn = `${p.col} / span ${p.w}`;
            art.style.gridRow    = `${p.row} / span ${p.h}`;
            art.tabIndex = 0;
            art.setAttribute('role', 'button');
            art.setAttribute('aria-label', t.titre || 'Toile');

            const cadre = document.createElement('div');
            cadre.className = 'cadre-grille';
            cadre.style.border = `3px solid ${couleurCadres}`;
            cadre.style.boxShadow = `0 0 0 1px rgba(0,0,0,.5), 2px 4px 14px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.06)`;

            if (t.photo) {
              const img = document.createElement('img');
              img.src = t.photo; img.alt = t.titre || ''; img.loading = 'lazy';
              cadre.appendChild(img);
            } else {
              cadre.style.background = 'linear-gradient(135deg,rgba(255,255,255,.04),rgba(0,0,0,.1))';
            }

            if (t.titre) {
              const lbl = document.createElement('div');
              lbl.className = 'tg-titre';
              lbl.textContent = t.titre;
              cadre.appendChild(lbl);
            }

            art.appendChild(cadre);
            const ouvrir = () => ouvrirModal(t);
            art.addEventListener('click', ouvrir);
            art.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){e.preventDefault();ouvrir();} });
            mur.appendChild(art);
          });

          // Ajoute le plancher avec silhouettes et portes
          const plancher = creerPlancher(salle.id, (sData.salles||[]).length, NOMS_ROMAINS, salle.couleur_mur);
          const salleElPl = mur.closest('.salle');
          if (salleElPl) salleElPl.appendChild(plancher);

        } else {
          // ── MODE FLUX (pas de positions → comportement original) ──
          const isMobile = window.innerWidth <= 600;
          const H_PREF = isMobile ? 155 : 200, H_FALLBACK = isMobile ? 120 : 160;
          const BORD = isMobile ? 16 : 26, N = isMobile ? 2 : toilesSalle.length;
          const cs = getComputedStyle(mur);
          const gapPx = parseFloat(cs.gap) || (isMobile ? 6 : 32);
          const padL  = parseFloat(cs.paddingLeft)  || (isMobile ? 8 : 40);
          const padR  = parseFloat(cs.paddingRight) || (isMobile ? 8 : 40);
          const dispo  = mur.clientWidth - padL - padR - (N-1)*gapPx - N*BORD;
          const totalW = toilesSalle.slice(0,N).reduce((s,t) => {
            const d = t.dimensions;
            return s + (d && d.largeur && d.hauteur ? Math.round(H_PREF*d.largeur/d.hauteur) : H_PREF);
          }, 0);
          const H = totalW <= dispo ? H_PREF : H_FALLBACK;
          toilesSalle.forEach(t => {
            const el = creerTableau(t, H);
            el.style.borderColor = couleurCadres;
            mur.appendChild(el);
          });
        }
      });
    })
    .catch(() => {
      ['mur1', 'mur2', 'mur3', 'mur4'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML =
          '<p style="color:var(--text-doux);font-style:italic;padding:2rem;">Données non disponibles.</p>';
      });
    });
  
    
  </script>
</body>
</html>
