<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie — Frédérique Ferette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body.theme-clair  { --mur:#ddd5c0; --cadre:#8b7355; --cadre-in:rgba(0,0,0,.12); --fil:#b8a88a; --parquet-a:#b8845a; --parquet-b:#d4aa7a; }
    body.theme-sombre { --mur:#1c1c1c; --cadre:#3d3020; --cadre-in:rgba(255,255,255,.06); --fil:#5a4a30; --parquet-a:#0e0a06; --parquet-b:#201610; }
    body.theme-bois   { --mur:#c4a87a; --cadre:#5a3e20; --cadre-in:rgba(0,0,0,.15); --fil:#8a6040; --parquet-a:#4a2e14; --parquet-b:#7a5030; }
    .galerie-principale { display:flex; flex-direction:column; height:calc(100vh - 4.5rem - 2.8rem); background-color:var(--bg); overflow:hidden; }
    .barre-navigation { display:flex; align-items:center; justify-content:center; gap:2rem; padding:1.1rem 2rem 0.5rem; }
    .indicateur-salle { font-family:Lato,sans-serif; font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; color:var(--text-doux); min-width:7rem; text-align:center; }
    .btn-nav-salle { background:none; border:1px solid var(--sep); color:var(--text-doux); width:2.4rem; height:2.4rem; border-radius:50%; cursor:pointer; font-size:1.4rem; display:flex; align-items:center; justify-content:center; transition:border-color .3s,color .3s,opacity .3s; }
    .btn-nav-salle:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .btn-nav-salle:disabled { opacity:.18; cursor:default; }
    .dots { display:flex; gap:.55rem; justify-content:center; padding:.3rem 0 .9rem; }
    .dot { width:5px; height:5px; border-radius:50%; background-color:var(--sep); transition:background-color .35s,transform .35s; }
    .dot.actif { background-color:var(--accent); transform:scale(1.4); }
    .conteneur-salles { display:flex; flex:1; width:400%; min-height:0; transition:transform .65s cubic-bezier(.77,0,.175,1); }
    .conteneur-salles.salle-2 { transform:translateX(-25%); }
    .conteneur-salles.salle-3 { transform:translateX(-50%); }
    .conteneur-salles.salle-4 { transform:translateX(-75%); }
    .salle { width:25%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:1rem 2rem 0; min-height:0; }
    .nom-salle { font-family:"Playfair Display",serif; font-style:italic; font-size:.88rem; letter-spacing:.18em; color:var(--text-doux); margin-bottom:1.2rem; text-align:center; }
    .mur { background-color:var(--mur); border-radius:3px 3px 0 0; width:100%; max-width:1080px; flex:1; min-height:0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; gap:2rem; flex-wrap:nowrap; padding:4rem 2.5rem 2.8rem; position:relative; box-shadow:inset 0 -80px 70px rgba(0,0,0,.10),inset 0 80px 80px rgba(0,0,0,.06),0 4px 24px rgba(0,0,0,.38); border-bottom:none; }
    .tableau { cursor:pointer; display:flex; flex-direction:column; align-items:center; position:relative; transition:transform .3s ease,filter .3s ease; margin-top:2.5rem; }
    .tableau:hover { transform:translateY(-5px); filter:brightness(1.06); }
    .tableau:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .tableau::before { content:''; position:absolute; top:-22px; left:50%; transform:translateX(-50%); width:55%; height:22px; border-top:1px solid var(--fil); border-left:1px solid var(--fil); border-right:1px solid var(--fil); border-radius:0 0 50% 50%/0 0 100% 100%; }
    .cadre { border:13px solid var(--cadre); box-shadow:0 10px 35px rgba(0,0,0,.50),0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px var(--cadre-in),inset 0 0 0 4px rgba(0,0,0,.12); position:relative; }
    .cadre::after { content:''; position:absolute; inset:0; border:3px solid rgba(255,255,255,.07); pointer-events:none; }
    .cadre img { display:block; width:210px; height:165px; object-fit:cover; }
    .placeholder { width:210px; height:165px; background:linear-gradient(135deg,rgba(0,0,0,.07),rgba(0,0,0,.02)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem; }
    .placeholder-num { font-family:"Playfair Display",serif; font-style:italic; font-size:3rem; color:var(--text-doux); opacity:.35; }
    .placeholder-txt { font-size:.65rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-doux); opacity:.4; }
    .etiquette { margin-top:.9rem; text-align:center; }
    .etiquette-titre { font-family:"Playfair Display",serif; font-style:italic; font-size:.84rem; color:var(--text); opacity:.82; }
    .etiquette-date { font-size:.7rem; color:var(--text-doux); margin-top:.15rem; letter-spacing:.06em; }
    /* Plinthe au bas du mur — bande sombre solide */
    .mur::after { content:''; position:absolute; bottom:0; left:0; right:0; height:13px; background:linear-gradient(to bottom, rgba(0,0,0,.28) 0%, rgba(0,0,0,.52) 100%); border-top:2px solid rgba(0,0,0,.38); pointer-events:none; z-index:1; }
    /* Spot lumineux au plafond au-dessus de chaque toile */
    .cadre::before { content:''; position:absolute; top:-95px; left:50%; transform:translateX(-50%); width:220%; height:115px; background:radial-gradient(ellipse at 50% 8%, rgba(255,245,190,.40) 0%, rgba(255,235,160,.16) 38%, transparent 65%); pointer-events:none; }
    /* Ombre portée elliptique au sol */
    .tableau::after { content:''; position:absolute; bottom:-18px; left:4%; width:92%; height:15px; background:radial-gradient(ellipse, rgba(0,0,0,.55) 0%, rgba(0,0,0,.22) 45%, transparent 70%); filter:blur(4px); pointer-events:none; }
    /* Sol parquet sous la plinthe */
    .parquet { width:100%; max-width:1080px; height:56px; background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0,rgba(0,0,0,.09) 1px,transparent 1px,transparent 70px),linear-gradient(to bottom,var(--parquet-a) 0%,var(--parquet-b) 100%); box-shadow:0 10px 28px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.06); border-radius:0 0 5px 5px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:9px; overflow:hidden; position:relative; }
    /* Banc de musée centré sur le parquet */
    .banc { color:var(--fil); opacity:.58; flex-shrink:0; }

    /* ============================================================
       MODES DE NAVIGATION A / C
       ============================================================ */

    /* Masquer barre-navigation et dots dans les deux modes */
    [data-nav] .barre-navigation,
    [data-nav] .dots { display:none; }

    /* ---- VERSION A : flèches flottantes ---- */
    .nav-float {
      position:fixed; top:50%; transform:translateY(-50%); z-index:60;
      width:52px; height:92px; background:rgba(0,0,0,.22); border:none;
      color:rgba(255,255,255,.35); font-size:2.4rem; cursor:pointer;
      display:none; align-items:center; justify-content:center;
      transition:background .3s,color .3s; backdrop-filter:blur(4px);
    }
    .nav-float-g { left:0; border-radius:0 8px 8px 0; }
    .nav-float-d { right:0; border-radius:8px 0 0 8px; }
    .nav-float:hover { background:rgba(0,0,0,.55); color:var(--accent); }
    .nav-float:disabled { opacity:.1; pointer-events:none; }
    [data-nav="a"] .nav-float { display:flex; }

    /* Pastille */
    .nav-pastille {
      position:fixed; bottom:1.8rem; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.07);
      border-radius:20px; padding:.3rem 1.15rem; font-family:Lato,sans-serif;
      font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
      color:var(--text-doux); display:none; white-space:nowrap;
      backdrop-filter:blur(6px); z-index:60;
    }
    [data-nav="a"] .nav-pastille { display:block; }

    /* Mini dots flottants */
    .nav-dots-float { position:fixed; bottom:.85rem; left:50%; transform:translateX(-50%); display:none; gap:.45rem; z-index:60; }
    [data-nav="a"] .nav-dots-float { display:flex; }
    .ndot { width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.18); transition:background .35s,transform .35s; }
    .ndot.actif { background:var(--accent); transform:scale(1.55); }

    /* ---- VERSION C : portes dans le mur ---- */
    .porte {
      position:absolute; bottom:0; z-index:3;
      display:none; flex-direction:column; align-items:center;
      cursor:pointer; user-select:none;
    }
    .porte-g { left:36px; }
    .porte-d { right:36px; }
    .porte.invisible { opacity:0; pointer-events:none; }
    [data-nav="c"] .porte { display:flex; }

    .porte-nom {
      font-family:Lato,sans-serif; font-style:normal; font-weight:400;
      font-size:.75rem; letter-spacing:.07em; color:var(--text-doux);
      margin-bottom:.4rem; white-space:nowrap;
      background:rgba(255,255,255,.07); padding:.1rem .45rem; border-radius:2px;
      text-shadow:0 1px 4px rgba(0,0,0,.9);
      transition:color .3s, background .3s;
    }
    .porte:hover .porte-nom { color:var(--accent); background:rgba(255,255,255,.11); }

    .porte-forme {
      width:50px; height:120px; border-radius:3px 3px 0 0;
      background:var(--cadre); position:relative;
      border:1px solid rgba(255,255,255,.18); border-bottom:none;
      box-shadow:inset 0 -6px 14px rgba(0,0,0,.5);
      transition:box-shadow .35s, border-color .35s;
    }
    .porte-interieur {
      position:absolute; inset:4px 4px 0; border-radius:0;
      background:radial-gradient(ellipse at 50% 110%, rgba(255,238,160,.18) 0%, rgba(0,0,0,.88) 62%);
    }
    .porte:hover .porte-forme {
      border-color:rgba(255,255,255,.32);
      box-shadow:inset 0 -6px 14px rgba(0,0,0,.5), 0 0 16px 5px var(--accent);
    }
    /* Chevron directionnel dans l'ouverture */
    .porte-fleche {
      position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
      font-size:1.1rem; color:rgba(255,255,255,.18); transition:color .3s;
      pointer-events:none;
    }
    .porte:hover .porte-fleche { color:rgba(255,255,255,.5); }

    /* ---- SWITCH BOUTON TEST ---- */
    .nav-test-switch {
      position:fixed; bottom:1.5rem; right:1.2rem; z-index:300;
      display:flex; gap:.35rem; align-items:center;
    }
    .btn-switch-mode {
      background:transparent; border:1px solid var(--sep); color:var(--text-doux);
      font-family:Lato,sans-serif; font-size:.65rem; letter-spacing:.14em;
      text-transform:uppercase; padding:.3rem .8rem; cursor:pointer;
      border-radius:2px; transition:background .25s,color .25s,border-color .25s;
      opacity:.7;
    }
    .btn-switch-mode.actif {
      background:var(--accent); border-color:var(--accent);
      color:var(--bg); opacity:1;
    }
    .btn-switch-label {
      font-family:Lato,sans-serif; font-size:.6rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--text-doux); opacity:.4;
      margin-right:.2rem;
    }
  </style>
</head>
  <style>
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; pointer-events:none; transition:opacity .35s ease; padding:1.5rem; }
    .modal-overlay.visible { opacity:1; pointer-events:all; }
    .modal-contenu { background-color:var(--bg); border:1px solid var(--sep); max-width:880px; width:100%; max-height:92vh; overflow-y:auto; display:flex; position:relative; transform:scale(.94); transition:transform .35s ease; }
    .modal-overlay.visible .modal-contenu { transform:scale(1); }
    .modal-image-wrap { flex:0 0 55%; max-height:88vh; overflow:hidden; display:flex; align-items:stretch; }
    .modal-image-wrap img { width:100%; object-fit:cover; display:block; }
    .modal-placeholder-grand { width:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(0,0,0,.06),rgba(0,0,0,.02)); font-family:"Playfair Display",serif; font-style:italic; font-size:5rem; color:var(--text-doux); opacity:.28; min-height:300px; }
    .modal-fiche { flex:1; padding:2.4rem 2rem 2rem; display:flex; flex-direction:column; gap:1rem; }
    .modal-titre { font-family:"Playfair Display",serif; font-weight:400; font-style:italic; font-size:1.55rem; color:var(--text); line-height:1.25; }
    .modal-separateur { width:2.2rem; height:1px; background-color:var(--sep); margin:-.2rem 0 .2rem; }
    .modal-ligne { display:flex; flex-direction:column; gap:.12rem; }
    .modal-label { font-size:.66rem; letter-spacing:.17em; text-transform:uppercase; color:var(--text-doux); }
    .modal-valeur { font-size:.9rem; color:var(--text); }
    .modal-fermer { position:absolute; top:.85rem; right:.85rem; background:none; border:1px solid var(--sep); color:var(--text-doux); width:2rem; height:2rem; border-radius:50%; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; z-index:1; transition:border-color .3s,color .3s; }
    .modal-fermer:hover { border-color:var(--accent); color:var(--accent); }
    @media (max-width:900px) { .mur { gap:2rem; padding:3.5rem 2rem 2.2rem; } }
    @media (max-width:700px) { .cadre img,.placeholder { width:155px; height:122px; } .mur { gap:1.8rem; padding:3rem 1.2rem 1.8rem; min-height:auto; } .modal-contenu { flex-direction:column; } .modal-image-wrap { flex:none; width:100%; max-height:48vw; } }
    @media (max-width:420px) { .cadre img,.placeholder { width:120px; height:94px; } .mur { gap:1.2rem; } .salle { padding:.5rem .8rem 1.5rem; } }
  </style>
</head>
<body class="theme-sombre">

  <header class="entete">
    <a href="index.html" class="lien-contact">&#8592; Accueil</a>
    <div class="controles">
      <button class="btn-musique off" id="btnMusique" aria-label="Musique on/off">
        <span id="iconeMusique">&#9835;</span>
      </button>
      <div class="selecteur-theme" role="group" aria-label="Choisir le décor">
        <button class="btn-theme" data-theme="theme-clair" title="Galerie claire">Clair</button>
        <button class="btn-theme" data-theme="theme-sombre" title="Galerie contemporaine sombre">Sombre</button>
        <button class="btn-theme" data-theme="theme-bois" title="Galerie traditionnelle bois">Bois</button>
      </div>
    </div>
  </header>

  <main class="galerie-principale">
    <nav class="barre-navigation" aria-label="Navigation entre les salles">
      <button class="btn-nav-salle" id="btnPrecedent" aria-label="Salle précédente" disabled>&#8249;</button>
      <span class="indicateur-salle">Salle <span id="numSalle">1</span>&thinsp;/&thinsp;4</span>
      <button class="btn-nav-salle" id="btnSuivant" aria-label="Salle suivante">&#8250;</button>
    </nav>
    <div class="dots" id="dotsNav" aria-hidden="true">
      <div class="dot actif"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="conteneur-salles" id="conteneurSalles">
      <div class="salle" id="salle1" aria-label="Salle 1">
        <p class="nom-salle">Salle I</p>
        <div class="mur" id="mur1"></div>
        <div class="parquet" aria-hidden="true">
          <svg class="banc" viewBox="0 0 160 30" width="160" height="30" fill="currentColor">
            <rect x="0" y="6" width="160" height="8" rx="2"/>
            <rect x="12" y="14" width="5" height="14" rx="1.5"/>
            <rect x="143" y="14" width="5" height="14" rx="1.5"/>
            <rect x="14" y="21" width="132" height="3" rx="1.5"/>
          </svg>
        </div>
      </div>
      <div class="salle" id="salle2" aria-label="Salle 2">
        <p class="nom-salle">Salle II</p>
        <div class="mur" id="mur2"></div>
        <div class="parquet" aria-hidden="true">
          <svg class="banc" viewBox="0 0 160 30" width="160" height="30" fill="currentColor">
            <rect x="0" y="6" width="160" height="8" rx="2"/>
            <rect x="12" y="14" width="5" height="14" rx="1.5"/>
            <rect x="143" y="14" width="5" height="14" rx="1.5"/>
            <rect x="14" y="21" width="132" height="3" rx="1.5"/>
          </svg>
        </div>
      </div>
      <div class="salle" id="salle3" aria-label="Salle 3">
        <p class="nom-salle">Salle III</p>
        <div class="mur" id="mur3"></div>
        <div class="parquet" aria-hidden="true">
          <svg class="banc" viewBox="0 0 160 30" width="160" height="30" fill="currentColor">
            <rect x="0" y="6" width="160" height="8" rx="2"/>
            <rect x="12" y="14" width="5" height="14" rx="1.5"/>
            <rect x="143" y="14" width="5" height="14" rx="1.5"/>
            <rect x="14" y="21" width="132" height="3" rx="1.5"/>
          </svg>
        </div>
      </div>
      <div class="salle" id="salle4" aria-label="Salle 4">
        <p class="nom-salle">Salle IV</p>
        <div class="mur" id="mur4"></div>
        <div class="parquet" aria-hidden="true">
          <svg class="banc" viewBox="0 0 160 30" width="160" height="30" fill="currentColor">
            <rect x="0" y="6" width="160" height="8" rx="2"/>
            <rect x="12" y="14" width="5" height="14" rx="1.5"/>
            <rect x="143" y="14" width="5" height="14" rx="1.5"/>
            <rect x="14" y="21" width="132" height="3" rx="1.5"/>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitre">
    <div class="modal-contenu">
      <button class="modal-fermer" id="modalFermer" aria-label="Fermer">&times;</button>
      <div class="modal-image-wrap" id="modalImageWrap"></div>
      <div class="modal-fiche">
        <h2 class="modal-titre" id="modalTitre"></h2>
        <div class="modal-separateur"></div>
        <div class="modal-ligne"><span class="modal-label">Date</span><span class="modal-valeur" id="modalDate"></span></div>
        <div class="modal-ligne"><span class="modal-label">Style</span><span class="modal-valeur" id="modalStyle"></span></div>
        <div class="modal-ligne"><span class="modal-label">Matériaux</span><span class="modal-valeur" id="modalMateriaux"></span></div>
        <div class="modal-ligne"><span class="modal-label">Dimensions</span><span class="modal-valeur" id="modalDimensions"></span></div>
        <div class="modal-ligne" id="modalDescLigne"><span class="modal-label">Description</span><span class="modal-valeur" id="modalDesc"></span></div>
      </div>
    </div>
  </div>

  <footer class="pied"><span class="mention">&copy; Frédérique Ferette</span></footer>

  <!-- Version A : flèches flottantes + pastille + mini dots -->
  <button class="nav-float nav-float-g" id="navFloatG" aria-label="Salle précédente">&#8249;</button>
  <button class="nav-float nav-float-d" id="navFloatD" aria-label="Salle suivante">&#8250;</button>
  <div class="nav-pastille" id="navPastille"></div>
  <div class="nav-dots-float" id="navDotsFloat">
    <span class="ndot"></span><span class="ndot"></span><span class="ndot"></span><span class="ndot"></span>
  </div>

  <!-- Switch temporaire A / C -->
  <div class="nav-test-switch" aria-label="Tester les modes de navigation">
    <span class="btn-switch-label">Nav</span>
    <button class="btn-switch-mode actif" id="btnModeA">A</button>
    <button class="btn-switch-mode"       id="btnModeC">C</button>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    let salleCourante = 1;
    const TOTAL_SALLES = 4;
    const NOMS_ROMAINS = ['I', 'II', 'III', 'IV'];
    const conteneur  = document.getElementById('conteneurSalles');
    const btnPrev    = document.getElementById('btnPrecedent');
    const btnNext    = document.getElementById('btnSuivant');
    const numSalleEl = document.getElementById('numSalle');
    const dotsEl     = document.querySelectorAll('.dot');
    let navMode = 'a';

    /* --- Portes mode C : injection dans chaque mur --- */
    for (let i = 1; i <= TOTAL_SALLES; i++) {
      const mur = document.getElementById('mur' + i);
      ['g', 'd'].forEach(cote => {
        const p = document.createElement('div');
        p.className = 'porte porte-' + cote + ' invisible';
        p.dataset.murId = i;
        p.dataset.cote  = cote;
        p.innerHTML =
          '<span class="porte-nom"></span>' +
          '<div class="porte-forme"><div class="porte-interieur"></div>' +
          '<span class="porte-fleche">' + (cote === 'g' ? '&#8249;' : '&#8250;') + '</span>' +
          '</div>';
        p.addEventListener('click', () => {
          const cible = parseInt(p.dataset.cible);
          if (cible >= 1 && cible <= TOTAL_SALLES) allerSalle(cible);
        });
        mur.appendChild(p);
      });
    }

    function mettreAJourNav() {
      /* Flèches mode A */
      const fg = document.getElementById('navFloatG');
      const fd = document.getElementById('navFloatD');
      if (fg) { fg.disabled = salleCourante === 1; fd.disabled = salleCourante === TOTAL_SALLES; }

      /* Pastille */
      const pastille = document.getElementById('navPastille');
      if (pastille) pastille.textContent =
        'Salle ' + NOMS_ROMAINS[salleCourante - 1] + ' / ' + NOMS_ROMAINS[TOTAL_SALLES - 1];

      /* Mini dots */
      document.querySelectorAll('.ndot').forEach((d, i) => d.classList.toggle('actif', i + 1 === salleCourante));

      /* Portes mode C */
      document.querySelectorAll('.porte').forEach(p => {
        const murId = parseInt(p.dataset.murId);
        const cible = p.dataset.cote === 'g' ? murId - 1 : murId + 1;
        p.dataset.cible = cible;
        const visible = cible >= 1 && cible <= TOTAL_SALLES;
        p.classList.toggle('invisible', !visible);
        if (visible) {
          const nom = 'Salle ' + NOMS_ROMAINS[cible - 1];
          p.querySelector('.porte-nom').textContent =
            p.dataset.cote === 'g' ? '← ' + nom : nom + ' →';
        }
      });
    }

    function allerSalle(n) {
      salleCourante = Math.max(1, Math.min(TOTAL_SALLES, n));
      conteneur.className = 'conteneur-salles' + (salleCourante > 1 ? ' salle-' + salleCourante : '');
      numSalleEl.textContent = salleCourante;
      btnPrev.disabled = salleCourante === 1;
      btnNext.disabled = salleCourante === TOTAL_SALLES;
      dotsEl.forEach((d, i) => d.classList.toggle('actif', i + 1 === salleCourante));
      mettreAJourNav();
    }

    btnPrev.addEventListener('click', () => allerSalle(salleCourante - 1));
    btnNext.addEventListener('click', () => allerSalle(salleCourante + 1));

    /* Flèches mode A */
    document.getElementById('navFloatG').addEventListener('click', () => allerSalle(salleCourante - 1));
    document.getElementById('navFloatD').addEventListener('click', () => allerSalle(salleCourante + 1));

    /* Switch A / C */
    function activerMode(mode) {
      navMode = mode;
      document.body.setAttribute('data-nav', mode);
      document.getElementById('btnModeA').classList.toggle('actif', mode === 'a');
      document.getElementById('btnModeC').classList.toggle('actif', mode === 'c');
      mettreAJourNav();
    }
    document.getElementById('btnModeA').addEventListener('click', () => activerMode('a'));
    document.getElementById('btnModeC').addEventListener('click', () => activerMode('c'));

    /* Init mode A */
    activerMode('a');

    const hashSalle = parseInt((window.location.hash.match(/^#salle-([2-4])$/) || [])[1]);
    if (hashSalle) {
      conteneur.style.transition = 'none';
      allerSalle(hashSalle);
      conteneur.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        conteneur.style.transition = '';
      }));
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('modalOverlay').classList.contains('visible')) {
        if (e.key === 'Escape') fermerModal();
        return;
      }
      if (e.key === 'ArrowRight') allerSalle(salleCourante + 1);
      if (e.key === 'ArrowLeft')  allerSalle(salleCourante - 1);
    });

    let touchX = null;
    conteneur.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    conteneur.addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 55) allerSalle(salleCourante + (dx < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });

    const modalOverlay = document.getElementById('modalOverlay');

    function ouvrirModal(toile) {
      document.getElementById('modalTitre').textContent = toile.titre || 'Sans titre';
      document.getElementById('modalDate').textContent  = toile.date  || '—';
      document.getElementById('modalStyle').textContent = toile.style || '—';
      document.getElementById('modalMateriaux').textContent =
        (toile.materiaux && toile.materiaux.length) ? toile.materiaux.join(', ') : '—';
      const dim = toile.dimensions;
      document.getElementById('modalDimensions').textContent =
        (dim && dim.format) ? dim.format + ' — ' + dim.largeur + ' × ' + dim.hauteur + ' cm' : '—';
      const descLigne = document.getElementById('modalDescLigne');
      const descVal   = document.getElementById('modalDesc');
      if (toile.description) { descVal.textContent = toile.description; descLigne.style.display = ''; }
      else { descLigne.style.display = 'none'; }
      const wrap = document.getElementById('modalImageWrap');
      if (toile.photo) {
        wrap.innerHTML = '<img src="' + toile.photo + '" alt="' + (toile.titre || 'Toile') + '">';
      } else {
        wrap.innerHTML = '<div class="modal-placeholder-grand">' + toile.id + '</div>';
      }
      modalOverlay.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    function fermerModal() {
      modalOverlay.classList.remove('visible');
      document.body.style.overflow = '';
    }

    document.getElementById('modalFermer').addEventListener('click', fermerModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) fermerModal(); });

    function creerTableau(toile) {
      const art = document.createElement('article');
      art.className = 'tableau';
      art.tabIndex  = 0;
      art.setAttribute('role', 'button');
      art.setAttribute('aria-label', (toile.titre || 'Sans titre') + (toile.date ? ', ' + toile.date : ''));
      const cadre = document.createElement('div');
      cadre.className = 'cadre';
      if (toile.photo) {
        const img = document.createElement('img');
        img.src = toile.photo; img.alt = toile.titre || 'Toile'; img.loading = 'lazy';
        cadre.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.innerHTML = '<span class="placeholder-num">' + toile.id + '</span><span class="placeholder-txt">Sans photo</span>';
        cadre.appendChild(ph);
      }
      const etiq = document.createElement('div');
      etiq.className = 'etiquette';
      etiq.innerHTML = '<div class="etiquette-titre">' + (toile.titre || '—') + '</div>' +
                       '<div class="etiquette-date">'  + (toile.date  || '')  + '</div>';
      art.appendChild(cadre);
      art.appendChild(etiq);
      const ouvrir = () => ouvrirModal(toile);
      art.addEventListener('click', ouvrir);
      art.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrir(); } });
      return art;
    }

    Promise.all([
      fetch('data/toiles.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('data/salles.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    ])
    .then(([tData, sData]) => {
      const toileMap = {};
      (tData.toiles || []).filter(t => t.visible !== false).forEach(t => { toileMap[t.id] = t; });
      (sData.salles || []).forEach(salle => {
        const mur = document.getElementById('mur' + salle.id);
        if (!mur) return;
        (salle.toiles || []).forEach(id => {
          if (toileMap[id]) mur.appendChild(creerTableau(toileMap[id]));
        });
      });
    })
    .catch(() => {
      ['mur1', 'mur2', 'mur3', 'mur4'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML =
          '<p style="color:var(--text-doux);font-style:italic;padding:2rem;">Données non disponibles.</p>';
      });
    });
  </script>
</body>
</html>
