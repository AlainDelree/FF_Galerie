<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    .bandeau-invite {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      background: rgba(10,8,5,.92);
      border-bottom: 1px solid rgba(200,160,80,.18);
      display: flex; align-items: center; justify-content: center;
      padding: .35rem 1rem;
      font-family: 'Lato', sans-serif;
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(200,160,80,.6);
    }
    .bandeau-invite a {
      color: rgba(200,160,80,.8);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,160,80,.3);
      transition: color .2s, border-color .2s;
      margin-left: .5rem;
    }
    .bandeau-invite a:hover { color: #c8a050; border-color: #c8a050; }
    .scene-entree { padding-top: 2rem; }

<body class="theme-sombre">

  <div class="bandeau-invite">

    <header class="entete">
      <nav class="nav-pages">
        <a href="index.html" class="lien-contact actif">Accueil</a>

    <main class="contenu-principal">
      <div class="encadre-titre">
        <h1 class="nom-artiste">Daw Wanpram</h1>
        <p class="sous-titre">Peintures</p>
        <div class="separateur"></div>
        <p class="titre-galerie">Galerie</p>

        <div class="plan-galerie" id="plan-galerie">
          <div id="plan-svg-wrap" style="width:100%;"></div>
          <p class="plan-legende">Cliquez sur une salle pour y entrer</p>
        </div>
      </div>
    </main>

    <footer class="pied">
      <div class="signature-artiste" aria-label="Signature de l'artiste">DW</div>
      <span class="mention">&copy; Daw Wanpram</span>
    </footer>

  </div>

  <script>
    window.PLAN_SALLES_PATH  = "data/salles.json";

  <script src="../../assets/js/main.js"></script>
