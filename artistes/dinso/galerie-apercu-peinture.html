<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu galerie peinture</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/galerie.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { overflow: hidden; background: #1a1a1a; user-select: none; -webkit-user-select: none; pointer-events: none; }
    .conteneur-salles { width: 100% !important; transform: none !important; height: 100vh !important; }
    /* La salle simule une scène : mur de la pièce (background #1a1a1a) avec
       marges latérales 13% / haut 5%, et zone-basse 31%. Le mur d'expo (avec
       les toiles) prend la place qui reste, naturellement centré. Valeurs
       validées sur tools/carte-apercu-peinture-preview.html. */
    .salle {
      width: 100% !important; height: 100vh !important;
      display: flex !important; flex-direction: column !important;
      padding: 5% 13% 0 13% !important;
      background: #1a1a1a !important;
    }
    /* Mur d'expo : flex-grow pour prendre la place dispo en haut */
    .mur, .mur.mur-grille {
      flex: 1 1 auto !important;
      width: 100% !important;
      aspect-ratio: auto !important; /* annule le 12/8 contraignant */
      min-height: 0 !important;
      padding: 0 !important;
      align-self: center !important;
    }
    /* Zone-basse : 31% de la hauteur de la salle, alignée à la largeur totale
       (déborde sur les marges latérales pour faire le sol complet). */
    .zone-basse, .salle-grille .zone-basse {
      flex: 0 0 auto !important;
      width: calc(100% + 30%) !important;  /* 13%*2 = 26% mais on prend large */
      margin: 0 -13% !important;
      height: 31% !important;
    }
    .mur-inferieur { flex: 0 0 38% !important; min-height: 12px !important; }
    .plancher-sol { flex: 1 1 auto !important; min-height: 0 !important; }
    /* Cacher tout ce qui n'est pas la salle */
    .bandeau-invite, .entete, .nav-pages, .controles, .btn-musique,
    .barre-navigation, .nav-mobile, .dots, .nav-retour, .retour-plan,
    .panneau-nav, .plaque-nav, .galerie-footer, .nom-salle, .porte { display: none !important; }
    /* Pas de clics */
    .tableau, .cadre, .porte { cursor: default !important; pointer-events: none !important; }
  </style>
</head>
<body class="theme-sombre" data-page="galerie">
  <div class="conteneur-salles" id="conteneurSalles"></div>
  <script>
    window.GALERIE_TOILES_PATH = "data/toiles.json";
    window.GALERIE_SALLES_PATH = "data/salles.json";
    window.GALERIE_ASSETS_BASE = "../../";
    /* Mode forcé via ?vue=pc|gsm */
    var _vue = new URLSearchParams(location.search).get('vue');
    window._GALERIE_FORCE_MOBILE = (_vue === 'gsm') ? true : (_vue === 'pc') ? false : null;
    window._GALERIE_READONLY = true;
  </script>
  <script src="../../assets/js/galerie-core.js?v=20260622f"></script>
  <script src="../../assets/js/galerie-peinture.js?v=20260622f"></script>
  <script>
    var _initDone = false;
    function _doInit() { if (_initDone) return; _initDone = true; initGalerie(); }
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'init-data' && !_initDone) {
        window._GALERIE_INJECTED = { toiles: e.data.toiles, salles: e.data.salles };
        _doInit();
      }
    });
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'iframe-awaiting-data' }, '*');
      setTimeout(_doInit, 800);
    } else {
      _doInit();
    }
  </script>
</body>
</html>
