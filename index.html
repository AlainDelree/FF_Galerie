<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Frédérique Ferette — Peintures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .nom-artiste, .sous-titre, .titre-galerie {
      background: linear-gradient(135deg, #c8a050 0%, #f0d080 40%, #c8a050 60%, #e8c060 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .titre-galerie {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      display: inline-block;
      margin-top: .5rem;
      opacity: .9;
    }
    .signature-artiste {
      font-family: 'Pinyon Script', cursive;
      font-size: 3.5rem;
      background: linear-gradient(135deg, #c8a050 0%, #f0d080 50%, #c8a050 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: .85;
      line-height: 1;
      margin-bottom: .2rem;
      letter-spacing: .05em;
    }
    .pied { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
    /* Header auto-hide */
    .entete {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      transform: translateY(0);
      transition: transform .4s ease;
    }
    .entete.cache {
      transform: translateY(-100%);
    }
  </style>
</head>
<body class="theme-sombre">

  <div class="scene-entree">

    <header class="entete">
      <nav class="nav-pages">
        <a href="index.html" class="lien-contact actif">Accueil</a>
        <span class="nav-sep">|</span>
        <a href="infos.html" class="lien-contact">Infos</a>
        <span class="nav-sep">|</span>
        <a href="contact.html" class="lien-contact">Contact</a>
      </nav>
      <div class="controles">
        <button class="btn-musique off" id="btnMusique" aria-label="Musique on/off">
          <span id="iconeMusique">&#9835;</span>
        </button>

      </div>
    </header>

    <main class="contenu-principal">
      <div class="encadre-titre">
        <h1 class="nom-artiste">Frédérique Ferette</h1>
        <p class="sous-titre">Peintures</p>
        <div class="separateur"></div>
        <p class="titre-galerie">Galerie</p>

        <!-- Plan interactif de la galerie -->
        <div class="plan-galerie">
          <svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan de la galerie — quatre salles reliées par un couloir central">
            <!-- Zones cliquables -->
            <a href="galerie.html#salle-1"><rect class="plan-salle" x="15" y="10" width="155" height="95" rx="1"/></a>
            <a href="galerie.html#salle-2"><rect class="plan-salle" x="230" y="10" width="155" height="95" rx="1"/></a>
            <a href="galerie.html#salle-3"><rect class="plan-salle" x="15" y="145" width="155" height="95" rx="1"/></a>
            <a href="galerie.html#salle-4"><rect class="plan-salle" x="230" y="145" width="155" height="95" rx="1"/></a>
            <!-- Couloir central -->
            <rect class="plan-couloir" x="15" y="105" width="370" height="40"/>
            <!-- Murs Salle I (15,10 → 170,105) -->
            <line class="plan-mur" x1="15"  y1="10"  x2="170" y2="10"/>
            <line class="plan-mur" x1="15"  y1="10"  x2="15"  y2="105"/>
            <line class="plan-mur" x1="170" y1="10"  x2="170" y2="105"/>
            <line class="plan-mur" x1="15"  y1="105" x2="74"  y2="105"/>
            <line class="plan-mur" x1="110" y1="105" x2="170" y2="105"/>
            <!-- Murs Salle II (230,10 → 385,105) -->
            <line class="plan-mur" x1="230" y1="10"  x2="385" y2="10"/>
            <line class="plan-mur" x1="230" y1="10"  x2="230" y2="105"/>
            <line class="plan-mur" x1="385" y1="10"  x2="385" y2="105"/>
            <line class="plan-mur" x1="230" y1="105" x2="290" y2="105"/>
            <line class="plan-mur" x1="326" y1="105" x2="385" y2="105"/>
            <!-- Murs Salle III (15,145 → 170,240) -->
            <line class="plan-mur" x1="15"  y1="145" x2="74"  y2="145"/>
            <line class="plan-mur" x1="110" y1="145" x2="170" y2="145"/>
            <line class="plan-mur" x1="15"  y1="145" x2="15"  y2="240"/>
            <line class="plan-mur" x1="170" y1="145" x2="170" y2="240"/>
            <line class="plan-mur" x1="15"  y1="240" x2="170" y2="240"/>
            <!-- Murs Salle IV (230,145 → 385,240) -->
            <line class="plan-mur" x1="230" y1="145" x2="290" y2="145"/>
            <line class="plan-mur" x1="326" y1="145" x2="385" y2="145"/>
            <line class="plan-mur" x1="230" y1="145" x2="230" y2="240"/>
            <line class="plan-mur" x1="385" y1="145" x2="385" y2="240"/>
            <line class="plan-mur" x1="230" y1="240" x2="385" y2="240"/>
            <!-- Murs couloir (segments entre les salles) -->
            <line class="plan-mur" x1="170" y1="105" x2="230" y2="105"/>
            <line class="plan-mur" x1="170" y1="145" x2="230" y2="145"/>
            <!-- Porte Salle I → couloir (arc vers intérieur) -->
            <line class="plan-porte" x1="110" y1="105" x2="110" y2="69"/>
            <path class="plan-porte" d="M 74,105 A 36,36 0 0,0 110,69"/>
            <!-- Porte Salle II → couloir -->
            <line class="plan-porte" x1="326" y1="105" x2="326" y2="69"/>
            <path class="plan-porte" d="M 290,105 A 36,36 0 0,0 326,69"/>
            <!-- Porte Salle III ← couloir (arc vers intérieur salle III) -->
            <line class="plan-porte" x1="110" y1="145" x2="110" y2="181"/>
            <path class="plan-porte" d="M 74,145 A 36,36 0 0,1 110,181"/>
            <!-- Porte Salle IV ← couloir -->
            <line class="plan-porte" x1="326" y1="145" x2="326" y2="181"/>
            <path class="plan-porte" d="M 290,145 A 36,36 0 0,1 326,181"/>
            <!-- Toiles Salle I -->
            <rect class="plan-toile" x="55"  y="8"   width="16" height="5"/>
            <rect class="plan-toile" x="105" y="8"   width="16" height="5"/>
            <rect class="plan-toile" x="13"  y="45"  width="5"  height="14"/>
            <rect class="plan-toile" x="168" y="45"  width="5"  height="14"/>
            <!-- Toiles Salle II -->
            <rect class="plan-toile" x="270" y="8"   width="16" height="5"/>
            <rect class="plan-toile" x="320" y="8"   width="16" height="5"/>
            <rect class="plan-toile" x="228" y="45"  width="5"  height="14"/>
            <rect class="plan-toile" x="383" y="45"  width="5"  height="14"/>
            <!-- Toiles Salle III -->
            <rect class="plan-toile" x="55"  y="238" width="16" height="5"/>
            <rect class="plan-toile" x="105" y="238" width="16" height="5"/>
            <rect class="plan-toile" x="13"  y="188" width="5"  height="14"/>
            <rect class="plan-toile" x="168" y="188" width="5"  height="14"/>
            <!-- Toiles Salle IV -->
            <rect class="plan-toile" x="270" y="238" width="16" height="5"/>
            <rect class="plan-toile" x="320" y="238" width="16" height="5"/>
            <rect class="plan-toile" x="228" y="188" width="5"  height="14"/>
            <rect class="plan-toile" x="383" y="188" width="5"  height="14"/>
            <!-- Labels -->
            <text class="plan-label" x="92"  y="59">Salle I</text>
            <text class="plan-label" x="307" y="59">Salle II</text>
            <text class="plan-label" x="92"  y="194">Salle III</text>
            <text class="plan-label" x="307" y="194">Salle IV</text>
          </svg>
          <p class="plan-legende">Cliquez sur une salle pour y entrer</p>
        </div>
      </div>
    </main>

    <footer class="pied">
      <div class="signature-artiste" aria-label="Signature de l'artiste">FF</div>
      <span class="mention">&copy; Frédérique Ferette</span>
      <span class="mention" style="font-size:.62rem;opacity:.38;margin-top:.15rem;">Musique&nbsp;: <em>Pictures at an Exhibition</em> — Mussorgsky &middot; <a href="https://musopen.org/music/performer/alexander-ghindin/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">Alexander Ghindin</a> &middot; CC&nbsp;BY</span>
    </footer>

  </div>

  <script src="assets/js/main.js"></script>
  <script>
    (function(){
      var h = document.querySelector('.entete');
      var timer;
      function show(){ h.classList.remove('cache'); clearTimeout(timer); timer = setTimeout(function(){ h.classList.add('cache'); }, 2500); }
      document.addEventListener('mousemove', function(e){ if(e.clientY < 80) show(); });
      document.addEventListener('touchstart', show);
      timer = setTimeout(function(){ h.classList.add('cache'); }, 2500);
    })();
  </script>

</body>
</html>
