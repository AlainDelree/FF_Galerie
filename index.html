<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frédérique Ferette — Peintures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="theme-sombre">

  <div class="scene-entree">

    <header class="entete">
      <a href="contact.html" class="lien-contact">Contact</a>
      <div class="controles">
        <button class="btn-musique off" id="btnMusique" aria-label="Musique on/off">
          <span id="iconeMusique">&#9835;</span>
        </button>
        <div class="selecteur-theme" role="group" aria-label="Choisir le décor">
          <button class="btn-theme" data-theme="theme-clair" title="Galerie claire">Clair</button>
          <button class="btn-theme" data-theme="theme-sombre" title="Galerie contemporaine sombre">Sombre</button>
          <button class="btn-theme" data-theme="theme-bois" title="Galerie traditionnelle bois">Bois</button>
        </div>
      </div>
    </header>

    <main class="contenu-principal">
      <div class="encadre-titre">
        <h1 class="nom-artiste">Frédérique Ferette</h1>
        <p class="sous-titre">Peintures</p>
        <div class="separateur"></div>
        <a href="galerie.html" class="btn-entrer">Entrer dans la galerie</a>

        <!-- Plan interactif de la galerie -->
        <div class="plan-galerie">
          <svg viewBox="0 0 400 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plan de la galerie — deux salles reliées par un couloir">
            <!-- Zones cliquables -->
            <a href="galerie.html#salle-1">
              <rect class="plan-salle" x="30" y="20" width="140" height="135" rx="1"/>
            </a>
            <a href="galerie.html#salle-2">
              <rect class="plan-salle" x="230" y="20" width="140" height="135" rx="1"/>
            </a>
            <!-- Couloir -->
            <rect class="plan-couloir" x="170" y="65" width="60" height="50"/>
            <!-- Murs Salle I -->
            <line class="plan-mur" x1="30" y1="20" x2="170" y2="20"/>
            <line class="plan-mur" x1="30" y1="20" x2="30" y2="155"/>
            <line class="plan-mur" x1="30" y1="155" x2="82" y2="155"/>
            <line class="plan-mur" x1="118" y1="155" x2="170" y2="155"/>
            <line class="plan-mur" x1="170" y1="20" x2="170" y2="65"/>
            <line class="plan-mur" x1="170" y1="115" x2="170" y2="155"/>
            <!-- Murs Salle II -->
            <line class="plan-mur" x1="230" y1="20" x2="370" y2="20"/>
            <line class="plan-mur" x1="370" y1="20" x2="370" y2="155"/>
            <line class="plan-mur" x1="230" y1="155" x2="282" y2="155"/>
            <line class="plan-mur" x1="318" y1="155" x2="370" y2="155"/>
            <line class="plan-mur" x1="230" y1="20" x2="230" y2="65"/>
            <line class="plan-mur" x1="230" y1="115" x2="230" y2="155"/>
            <!-- Murs couloir -->
            <line class="plan-mur" x1="170" y1="65" x2="230" y2="65"/>
            <line class="plan-mur" x1="170" y1="115" x2="230" y2="115"/>
            <!-- Porte Salle I (arc vers intérieur) -->
            <line class="plan-porte" x1="118" y1="155" x2="118" y2="119"/>
            <path class="plan-porte" d="M 82,155 A 36,36 0 0,0 118,119"/>
            <!-- Porte Salle II (arc vers intérieur) -->
            <line class="plan-porte" x1="282" y1="155" x2="282" y2="119"/>
            <path class="plan-porte" d="M 318,155 A 36,36 0 0,0 282,119"/>
            <!-- Toiles Salle I -->
            <rect class="plan-toile" x="58" y="18" width="18" height="5"/>
            <rect class="plan-toile" x="120" y="18" width="18" height="5"/>
            <rect class="plan-toile" x="28" y="55" width="5" height="18"/>
            <rect class="plan-toile" x="28" y="100" width="5" height="18"/>
            <!-- Toiles Salle II -->
            <rect class="plan-toile" x="248" y="18" width="18" height="5"/>
            <rect class="plan-toile" x="310" y="18" width="18" height="5"/>
            <rect class="plan-toile" x="367" y="55" width="5" height="18"/>
            <rect class="plan-toile" x="367" y="100" width="5" height="18"/>
            <!-- Labels -->
            <text class="plan-label" x="100" y="92">Salle I</text>
            <text class="plan-label" x="300" y="92">Salle II</text>
          </svg>
          <p class="plan-legende">Cliquez sur une salle pour y entrer</p>
        </div>
      </div>
    </main>

    <footer class="pied">
      <span class="mention">&copy; Frédérique Ferette</span>
    </footer>

  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
