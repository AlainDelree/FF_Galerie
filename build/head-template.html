    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="{{ASSETS_BASE}}{{FAVICON}}">
    <title>{{TITLE}}</title>
    <!-- SEO -->
    <meta name="description"        content="{{DESCRIPTION}}">
    <meta name="author"             content="Frédérique Ferette">
    <meta name="robots"             content="{{ROBOTS}}">
    <link rel="canonical"           href="{{CANONICAL}}">
    <!-- Open Graph -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="Frédérique Ferette">
    <meta property="og:locale"      content="fr_BE">
    <meta property="og:title"       content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:url"         content="{{OG_URL}}">
    <meta property="og:image"       content="{{OG_IMAGE}}">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:alt"   content="Toile de Frédérique Ferette">
    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="{{TW_TITLE}}">
    <meta name="twitter:description" content="{{TW_DESCRIPTION}}">
    <meta name="twitter:image"       content="{{TW_IMAGE}}">
    <!-- PWA -->
    <link rel="manifest"          href="{{ASSETS_BASE}}manifest.webmanifest">
    <meta name="theme-color"      content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galerie Ferette">
    <link rel="apple-touch-icon"  href="{{ASSETS_BASE}}assets/images/icons/icon-192.png">
    <script src="{{ASSETS_BASE}}assets/js/pwa-register.js" defer></script>
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{FONTS_URL}}" rel="stylesheet">
